/* ---------- single receipt ---------- */
async function openReceipt(r) {
  const isPdf = r.file_type === 'application/pdf';
  let url = r.image_cleared ? null : thumbs.get(r.file_path);
  if (!url && !r.image_cleared) {
    const { data } = await db.storage.from(BUCKET).createSignedUrl(r.file_path, 3600);
    url = data?.signedUrl;
    if (url && !isPdf) thumbs.set(r.file_path, url);
  }

  const overlay = el('div', { class: 'viewer' }, [
    el('div', { class: 'vhead' }, [
      el('button', { class: 'icb', 'aria-label': 'Back', onclick: () => overlay.remove(),
        html: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' }),
      el('b', { text: r.description || 'Receipt' }),
      el('button', { class: 'icb vreset', 'aria-label': 'Reset zoom',
        html: '<svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/></svg>' }),
      el('button', { class: 'icb', 'aria-label': 'Move to folder',
        onclick: () => moveToFolder([r.id], () => overlay.remove()),
        html: '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>' }),
      el('button', { class: 'icb', 'aria-label': 'Delete', onclick: () => removeReceipt(r, overlay),
        html: '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>' +
              '<path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>' })
    ]),
    el('div', { class: 'vbody', id: 'vbody' }, [
      r.image_cleared
        ? el('p', { class: 'empty', text:
            'The picture for this one was cleared to save space. ' +
            (r.amount != null ? money(r.amount) : 'No amount') +
            (r.vat != null ? ' · VAT ' + money(r.vat) : '') +
            ' on ' + prettyDate(r.receipt_date) + ' is still on record.' })
      : !url ? el('p', { class: 'empty', text: 'Could not load this file.' })
      : isPdf
        ? el('a', { class: 'btn btn-primary', href: url, target: '_blank',
                    rel: 'noopener', text: 'Open PDF' })
        : el('img', { id: 'vimg', src: url, alt: r.description || 'Receipt',
                      decoding: 'async' })
    ])
  ]);
  document.body.appendChild(overlay);
  if (url && !isPdf && !r.image_cleared) bindViewerGestures(overlay);
}

/* Zoom and pan the receipt only. Transforms are written straight to the element
   and committed on an animation frame, so dragging tracks the finger instead of
   queueing up layout work. Double-tap snaps back to fit. */
function bindViewerGestures(overlay) {
  bindZoomGestures(overlay, overlay.querySelector('#vimg'), overlay.querySelector('#vbody'));
}

/* host  — gets the .zoomed class, and holds the optional .vreset control
   img   — the picture that is transformed
   area  — the box the gesture is read from and the picture is clamped to */
function bindZoomGestures(host, img, area) {
  const overlay = host;
  if (!img || !area) return;

  let z = 1, tx = 0, ty = 0;
  let startDist = 0, startZ = 1, startX = 0, startY = 0, panX = 0, panY = 0;
  let panning = false, frame = 0;

  const MAXZ = 6;
  const apply = () => {
    frame = 0;
    img.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${z})`;
  };
  const schedule = () => { if (!frame) frame = requestAnimationFrame(apply); };

  const clamp = () => {
    // keep the picture from being dragged completely off screen
    const r = area.getBoundingClientRect();
    const w = img.clientWidth * z, h = img.clientHeight * z;
    const mx = Math.max(0, (w - r.width) / 2), my = Math.max(0, (h - r.height) / 2);
    tx = Math.min(mx, Math.max(-mx, tx));
    ty = Math.min(my, Math.max(-my, ty));
  };
  const reset = () => { z = 1; tx = ty = 0; img.style.transition = 'transform .18s ease';
                        schedule(); setTimeout(() => { img.style.transition = ''; }, 200);
                        overlay.classList.remove('zoomed'); };

  const dist = e => Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY);

  area.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      startDist = dist(e); startZ = z; panning = false;
    } else if (e.touches.length === 1 && z > 1.01) {
      panning = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      panX = tx; panY = ty;
    }
  }, { passive: true });

  area.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && startDist > 0) {
      e.preventDefault();
      z = Math.min(MAXZ, Math.max(1, startZ * (dist(e) / startDist)));
      if (z <= 1.01) { tx = ty = 0; }
      overlay.classList.toggle('zoomed', z > 1.01);
      clamp(); schedule();
    } else if (panning && e.touches.length === 1) {
      e.preventDefault();                       // pan the picture, not the page
      tx = panX + (e.touches[0].clientX - startX);
      ty = panY + (e.touches[0].clientY - startY);
      clamp(); schedule();
    }
  }, { passive: false });

  area.addEventListener('touchend', e => {
    if (e.touches.length === 0) { panning = false; startDist = 0; }
  }, { passive: true });

  let lastTap = 0;
  area.addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 300) { z > 1.01 ? reset() : (z = 2.5, overlay.classList.add('zoomed'), schedule()); }
    lastTap = now;
  });

  overlay.querySelector('.vreset')?.addEventListener('click', reset);
}

async function removeReceipt(r, viewer) {
  const ok = await ask('Delete this receipt?',
    `"${r.description || 'This receipt'}" will be removed for everyone. This cannot be undone.`,
    'Delete');
  if (!ok) return;
  busy(true, 'Deleting…');
  try {
    const { error } = await db.from('receipts').delete().eq('id', r.id);
    if (error) throw error;
    if (!r.image_cleared) await db.storage.from(BUCKET).remove([r.file_path]);
    thumbs.delete(r.file_path);
    viewer?.remove();
    closeSheet();
    await loadMonth();
    toast('Deleted');
  } catch (e) {
    toast(niceError(e), true);
  } finally { busy(false); }
}

/* ============================================================
   CAPTURE  →  DETAILS  →  SAVE
   ============================================================ */
let saving = false;                    // one save at a time, never two
let captureDate = null;
let captureFolder = null;      // set when Add Receipt is pressed inside a folder

function startCapture(kind, dateStr, folderId) {
  captureDate = dateStr || ymd(new Date());
  captureFolder = folderId || null;
  if (kind === 'cam') { openCamera(false); return; }
  const input = $('#ffile');          // the camera's own Files button lands here
  input.value = '';
  input.click();
}

$('#snap').onclick = () => startCapture('cam', ymd(new Date()));
$('#fcam').onchange    = e => handlePicked(e.target.files[0]);
$('#ffile').onchange   = e => handlePicked(e.target.files[0]);

/* ---------- Add receipt: straight to the camera ----------
   One way in: the normal camera. The camera's own Files button covers a photo
   already in the roll or a PDF, and both land in the same pipeline —
   handlePicked()/fromCanvas() — so every route ends at the same confirm sheet. */

/* ---------- one photo, several receipts ---------- */
let batch = null;                 // { items, i, saved, skipped }

function freeItem(it) {
  if (it && it.urls) Object.values(it.urls).forEach(u => u && URL.revokeObjectURL(u));
  if (it) it.urls = null;
}

async function itemFromCanvas(c, name) {
  // photo is the receipt: the original colour frame, kept, stored and shown.
  // scan is never saved or displayed — it is a high-contrast copy handed to the
  // text reader only, because OCR is far more accurate on flattened lighting.
  const photo = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
  const scan  = await makeScan(c);
  return { photo, scan, chosen: 'photo',
           type: 'image/jpeg', ext: 'jpg', name: name || 'receipt.jpg' };
}

async function fromCanvas(c, name) {
  busy(true, 'Looking for receipts…');
  let boxes = [];
  try { boxes = detectReceipts(c); } catch { boxes = []; }

  if (boxes.length >= 2) {
    const items = [];
    for (let i = 0; i < boxes.length; i++) {
      busy(true, `Preparing ${i + 1} of ${boxes.length}…`, (i + 1) / boxes.length);
      items.push(await itemFromCanvas(cropCanvas(c, boxes[i]), name));
    }
    busy(false);
    offerBatch(items, c, name);
    return;
  }

  busy(true, 'Preparing…');
  pending = await itemFromCanvas(c, name);
  busy(false);
  openDetails();
}

function offerBatch(items, src, name) {
  const previews = items.map(it => URL.createObjectURL(it.photo));
  const dropPreviews = () => previews.forEach(u => URL.revokeObjectURL(u));

  const grid = el('div', { class: 'bgrid' }, items.map((it, i) =>
    el('div', { class: 'bcell' }, [
      el('img', { src: previews[i], alt: 'Receipt ' + (i + 1) }),
      el('span', { text: String(i + 1) })
    ])));

  sheet({
    title: `Found ${items.length} receipts`,
    body: [
      grid,
      el('p', { class: 'hintline', text:
        'Each one is read and shown for checking before anything is filed, so they can '
        + 'land on different days. If this split is wrong, file the whole photo as one instead.' })
    ],
    foot: [
      el('button', { class: 'btn btn-ghost', text: 'File as one', onclick: async () => {
        dropPreviews(); items.forEach(freeItem);
        closeSheet();
        busy(true, 'Preparing…');
        pending = await itemFromCanvas(src, name);
        busy(false);
        openDetails();
      } }),
      el('button', { class: 'btn btn-primary', text: 'Check each one', onclick: () => {
        dropPreviews();
        batch = { items, i: 0, saved: 0, skipped: 0 };
        closeSheet();
        nextInBatch();
      } })
    ],
    onClose: () => { dropPreviews(); items.forEach(freeItem); }
  });
}

async function nextInBatch() {
  if (!batch) return;
  if (batch.i >= batch.items.length) {
    const { saved, skipped } = batch;
    batch = null; pending = null;
    closeSheet();
    await loadMonth();
    toast(saved
      ? `Filed ${saved}` + (skipped ? `, skipped ${skipped}` : '')
      : 'Nothing filed');
    return;
  }
  pending = batch.items[batch.i];
  openDetails();
}

function abandonBatch() {
  if (!batch) return;
  batch.items.forEach(freeItem);
  batch = null;
  pending = null;
}

/* ---------- live camera ---------- */
let stream = null;

function cameraProblem(e) {
  const n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError')
    return 'Camera access is turned off. Switch it on in Settings → Receipts → Camera, then reopen the app.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError')
    return 'No camera found on this device. Use Files instead.';
  if (n === 'NotReadableError')
    return 'Another app is using the camera. Close it and try again.';
  return 'Could not start the camera. You can still add a receipt with Files.';
}

/* ---------- pinch to zoom ----------
   Real optical/sensor zoom via the track when the device exposes it (Android
   mostly); otherwise a digital zoom done by scaling the preview and cropping the
   same region out of the captured frame, so the photo matches the framing. */
let camZoom = 1, camZoomMax = 5, camNativeZoom = false, camTrack = null;

function setZoom(z, show) {
  camZoom = Math.min(camZoomMax, Math.max(1, z));
  const v = $('#camvid');
  if (camNativeZoom && camTrack) {
    camTrack.applyConstraints({ advanced: [{ zoom: camZoom }] }).catch(() => {});
    v.style.transform = '';
  } else {
    v.style.transform = camZoom > 1 ? `scale(${camZoom})` : '';
    v.style.transformOrigin = 'center center';
  }
  const pill = $('#camzoom');
  $('#camzoomval').textContent = camZoom.toFixed(1) + '\u00d7';
  pill.classList.toggle('hide', !(show || camZoom > 1.001));
}

function initZoom(track) {
  camTrack = track; camZoom = 1; camNativeZoom = false; camZoomMax = 5;
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : null;
    if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
      camNativeZoom = true;
      camZoomMax = Math.min(8, caps.zoom.max);
    }
  } catch { /* capabilities are optional; digital zoom covers it */ }
  setZoom(1, false);
}

(function bindPinch() {
  const sec = $('#cam');
  let startDist = 0, startZoom = 1;
  const dist = e => Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY);

  sec.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { startDist = dist(e); startZoom = camZoom; }
  }, { passive: true });

  sec.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && startDist > 0) {
      e.preventDefault();
      setZoom(startZoom * (dist(e) / startDist), true);
    }
  }, { passive: false });

  sec.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      startDist = 0;
      setTimeout(() => setZoom(camZoom, false), 900);   // let the pill fade out
    }
  }, { passive: true });

  // a laptop can still zoom, for testing
  sec.addEventListener('dblclick', () => setZoom(camZoom > 1 ? 1 : 2, true));
})();

async function openCamera(auto) {
  captureDate = captureDate || ymd(new Date());
  $('#camdate').textContent = captureDate === ymd(new Date())
    ? 'Today' : prettyDate(captureDate);
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('unsupported');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' },
               width: { ideal: 1920 }, height: { ideal: 1920 } },
      audio: false
    });
    $('#camvid').srcObject = stream;
    initZoom(stream.getVideoTracks()[0]);
    $('#camshot').disabled = false;
    $('#cam').classList.remove('hide');
    document.documentElement.style.overflow = 'hidden';
  } catch (e) {
    closeCamera();
    // On launch we stay quiet — landing on the calendar is a fine outcome.
    if (!auto) toast(cameraProblem(e), true);
  }
}

function closeCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = $('#camvid');
  if (v) { v.srcObject = null; v.style.transform = ''; }
  camTrack = null; camZoom = 1;
  $('#camzoom') && $('#camzoom').classList.add('hide');
  $('#cam').classList.add('hide');
  document.documentElement.style.overflow = '';
}

$('#camx').onclick    = closeCamera;
$('#camfile').onclick = () => { closeCamera(); const i = $('#ffile'); i.value = ''; i.click(); };

$('#camshot').onclick = async () => {
  const v = $('#camvid');
  if (!v.videoWidth) { toast('Camera is still warming up', true); return; }
  const btn = $('#camshot');
  btn.disabled = true;
  try {
    // With native zoom the stream is already zoomed; with digital zoom we crop the
    // same centre region the preview is showing so the shot matches the framing.
    const z = camNativeZoom ? 1 : camZoom;
    const sw = v.videoWidth / z, sh = v.videoHeight / z;
    const sx = (v.videoWidth - sw) / 2, sy = (v.videoHeight - sh) / 2;
    const MAX = 1600;
    const k = Math.min(1, MAX / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width  = Math.max(1, Math.round(sw * k));
    c.height = Math.max(1, Math.round(sh * k));
    c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
    closeCamera();
    await fromCanvas(c, 'receipt.jpg');
  } catch (e) {
    busy(false);
    toast('Could not capture that frame. Try again.', true);
  } finally {
    btn.disabled = false;
  }
};

/* ============================================================
   READING THE RECEIPT
   OCR runs against the scanned version — high contrast reads far better than a
   raw photo. It only ever *suggests*: what it finds is written into the fields
   and shown for checking, never saved on its own.
   ============================================================ */
const MONTH_WORDS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

function plausible(y, m, d) {
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  if (y < 100) y += y > 70 ? 1900 : 2000;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  const now = new Date();
  const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  const floor = new Date(now.getFullYear() - 15, 0, 1);
  if (dt > tomorrow || dt < floor) return null;      // a receipt is never from the future
  return ymd(dt);
}

/* UK ordering is assumed for ambiguous pairs — 03/04 reads as 3 April. Where one
   number is over 12 the order isn't ambiguous and that reading wins instead. */
function findDate(text) {
  const t = String(text || '').replace(/\|/g, '/');
  let m;

  const numeric = /\b(\d{1,4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})\b/g;
  while ((m = numeric.exec(t))) {
    const a = +m[1], b = +m[2], c = +m[3];
    let hit = null;
    if (m[1].length === 4)          hit = plausible(a, b, c);          // YYYY-MM-DD
    else if (a > 12 && b <= 12)     hit = plausible(c, b, a);          // must be DD/MM
    else if (b > 12 && a <= 12)     hit = plausible(c, a, b);          // must be MM/DD
    else                            hit = plausible(c, b, a) || plausible(c, a, b);
    if (hit) return { date: hit, raw: m[0].replace(/\s+/g, '') };
  }

  const dayFirst = new RegExp(
    '\\b(\\d{1,2})\\s*[-. ]?\\s*(' + MONTH_WORDS.join('|') + ')[a-z]*\\.?,?\\s*(\\d{2,4})\\b', 'gi');
  while ((m = dayFirst.exec(t))) {
    const hit = plausible(+m[3], MONTH_WORDS.indexOf(m[2].toLowerCase()) + 1, +m[1]);
    if (hit) return { date: hit, raw: m[0].replace(/\s+/g, ' ') };
  }

  const monthFirst = new RegExp(
    '\\b(' + MONTH_WORDS.join('|') + ')[a-z]*\\.?\\s+(\\d{1,2}),?\\s*(\\d{2,4})\\b', 'gi');
  while ((m = monthFirst.exec(t))) {
    const hit = plausible(+m[3], MONTH_WORDS.indexOf(m[1].toLowerCase()) + 1, +m[2]);
    if (hit) return { date: hit, raw: m[0].replace(/\s+/g, ' ') };
  }
  return null;
}

/* "VAT 20% 28.18" would otherwise offer up the 20 as the amount, so rates are
   stripped before any number is read off a line. */
const dropRates = s => s.replace(/\d+(?:[.,]\d+)?\s*%/g, ' ');

function lastMoneyOn(line) {
  const hits = [...dropRates(line).matchAll(/(\d{1,5}[.,]\d{2})/g)];
  if (!hits.length) return null;
  const v = parseFloat(hits[hits.length - 1][1].replace(',', '.'));
  return isFinite(v) && v >= 0 && v < 100000 ? v : null;
}

function findTotal(text) {
  let best = null;
  for (const line of String(text || '').split(/\n+/)) {
    if (!/total|amount due|to pay|balance/i.test(line)) continue;
    if (/sub\s*-?total|vat|tax|change|tender|card\s*no/i.test(line)) continue;
    const v = lastMoneyOn(line);
    if (v !== null && v > 0) best = { amount: v, raw: line.trim().slice(0, 42) };
  }
  return best;
}

/* ============================================================
   READING THE MONEY OFF A RECEIPT
   Four figures are kept apart and never conflated: net, VAT, VAT rate, gross.
   Nothing is assumed. A rate is only used when the receipt prints one, and VAT
   is only derived when there is a printed rate to derive it from. If the receipt
   does not say, the answer is "unknown" and the field is left for a human.
   ============================================================ */

function findInvoiceNo(text) {
  // the label may be followed by any of "NO", "No.", "#", ":" or nothing at all
  const m = String(text || '').match(
    /(?:invoice|receipt|order|docket|trans(?:action)?)\s*(?:no\.?|number|#)?\s*:?\s*([A-Z0-9][A-Z0-9\/-]{2,19})/i);
  if (!m) return null;
  const id = m[1].replace(/[.,]$/, '');
  if (!/\d/.test(id)) return null;                       // must carry a number
  if (/^\d{1,2}[\/-]\d{1,2}([\/-]\d{2,4})?$/.test(id)) return null;   // that is a date
  return id;
}

/* Which currency the receipt was printed in, so a euro till roll is not filed
   as pounds. Nothing else is read off the picture. */
function findCurrency(text) {
  const t = String(text || '');
  if (/€|\bEUR\b/i.test(t)) return 'EUR';
  if (/\$|\bUSD\b/i.test(t)) return 'USD';
  return 'GBP';
}

/* Fill in whichever of net / VAT / rate / gross can be derived from the others.
   `locked` names the figures that came off the receipt or from the user, and
   those are never overwritten. */
/* UK standard rate. Totals are treated as VAT-inclusive, so this is applied as
   total x 20 / 120 — never as 20% of the total. */
const DEFAULT_VAT_RATE = 20;

function reconcile(v, locked) {
  const has = x => v[x] !== null && v[x] !== undefined && isFinite(v[x]);
  const free = x => !locked.includes(x);
  const r2 = n => Math.round(n * 100) / 100;

  for (let pass = 0; pass < 3; pass++) {
    if (has('net') && has('vat') && free('total')) v.total = r2(v.net + v.vat);
    if (has('total') && has('vat') && free('net'))  v.net   = r2(v.total - v.vat);
    if (has('total') && has('net') && free('vat'))  v.vat   = r2(v.total - v.net);

    // 0% is a rate like any other: it means no VAT, not unknown VAT
    if (has('rate') && v.rate >= 0) {
      if (has('net') && !has('vat') && free('vat'))   v.vat = r2(v.net * v.rate / 100);
      if (has('total') && !has('net') && !has('vat')) {
        v.vat = r2(v.total * v.rate / (100 + v.rate));
        if (free('net')) v.net = r2(v.total - v.vat);
      }
    }
    if (has('net') && has('vat') && !has('rate') && free('rate') && v.net > 0) {
      v.rate = Math.round(v.vat / v.net * 1000) / 10;
    }
  }
  return v;
}

function reconcileWarning(v) {
  const n = Number(v.net), a = Number(v.vat), g = Number(v.total);
  if (![n, a, g].every(isFinite)) return null;
  return Math.abs(n + a - g) > 0.02
    ? `Net + VAT is ${money(n + a)}, but the total says ${money(g)}.`
    : null;
}

function loadOcr() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload  = () => res(window.Tesseract);
    s.onerror = () => rej(new Error('unavailable'));
    document.head.appendChild(s);
  });
}

let ocrWorker = null;
async function getWorker() {
  if (ocrWorker) return ocrWorker;
  const T = await loadOcr();
  ocrWorker = await T.createWorker('eng');
  return ocrWorker;
}

/* Runs behind the details sheet rather than in front of it, so nothing is ever
   waiting on the reader. `token` stops a slow result landing in a later sheet. */
let readToken = 0;
async function readReceipt(target, token) {
  let timer;
  const timeout = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error('slow')), 60000); });
  try {
    const worker = await Promise.race([getWorker(), timeout]);
    const { data } = await Promise.race([worker.recognize(target.scan || target.photo), timeout]);
    if (token !== readToken) return;
    const txt = data && data.text;
    // The reader now looks for two things only: the date and the total.
    // VAT is never read off the picture — it comes from the rate on the form,
    // which starts at 20% and is the user's to change.
    const tot = findTotal(txt);

    target.read = {
      ok: true,
      date: findDate(txt),
      total: tot ? tot.amount : null,
      raw: { total: tot && tot.raw },
      invoiceNo: findInvoiceNo(txt),
      currency: findCurrency(txt)
    };
  } catch (e) {
    if (token !== readToken) return;
    target.read = { ok: false, why: /slow/.test(e.message) ? 'slow' : 'unavailable' };
  } finally {
    clearTimeout(timer);
  }
  if (token === readToken) applyRead(target);
}

/* ============================================================
   FINDING SEVERAL RECEIPTS IN ONE PHOTO
   Receipts are the bright things; the surface under them is not. Threshold on
   that split, label the connected bright regions, and keep the ones that are
   big and solid enough to be paper. Works when receipts are laid out apart on a
   contrasting surface; two that touch will come through as one, which is why
   nothing is filed until the split has been shown and accepted.
   ============================================================ */
const MAX_IN_ONE_SHOT = 8;

function otsuThreshold(gray) {
  const hist = new Uint32Array(256);
  for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
  const total = gray.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, best = -1, thr = 128;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = total - wB; if (!wF) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > best) { best = between; thr = t; }
  }
  return thr;
}

function brightRegions(mask, w, h) {
  const label = new Int32Array(w * h);
  const stack = new Int32Array(w * h);
  const out = [];
  let id = 0;
  for (let p = 0; p < mask.length; p++) {
    if (!mask[p] || label[p]) continue;
    id++;
    let sp = 0; stack[sp++] = p; label[p] = id;
    let minx = w, maxx = 0, miny = h, maxy = 0, area = 0;
    while (sp) {
      const q = stack[--sp];
      const x = q % w, y = (q / w) | 0;
      area++;
      if (x < minx) minx = x;
      if (x > maxx) maxx = x;
      if (y < miny) miny = y;
      if (y > maxy) maxy = y;
      if (x > 0     && mask[q - 1] && !label[q - 1]) { label[q - 1] = id; stack[sp++] = q - 1; }
      if (x < w - 1 && mask[q + 1] && !label[q + 1]) { label[q + 1] = id; stack[sp++] = q + 1; }
      if (y > 0     && mask[q - w] && !label[q - w]) { label[q - w] = id; stack[sp++] = q - w; }
      if (y < h - 1 && mask[q + w] && !label[q + w]) { label[q + w] = id; stack[sp++] = q + w; }
    }
    out.push({ minx, maxx, miny, maxy, area });
  }
  return out;
}

function detectReceipts(canvas) {
  const W = canvas.width, H = canvas.height;
  const k = Math.min(1, 380 / W);
  const w = Math.max(40, Math.round(W * k)), h = Math.max(40, Math.round(H * k));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  cx.drawImage(canvas, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h).data;

  const gray = new Uint8Array(w * h);
  for (let i = 0, p = 0; p < gray.length; i += 4, p++)
    gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;

  const thr = otsuThreshold(gray);
  const mask = new Uint8Array(w * h);
  let bright = 0;
  for (let p = 0; p < gray.length; p++) { if (gray[p] > thr) { mask[p] = 1; bright++; } }

  // one receipt filling the frame, or no contrast at all — nothing to split
  const brightFrac = bright / (w * h);
  if (brightFrac > 0.72 || brightFrac < 0.02) return [];

  const total = w * h;
  const kept = brightRegions(mask, w, h).filter(r => {
    const bw = r.maxx - r.minx + 1, bh = r.maxy - r.miny + 1;
    const boxFrac = (bw * bh) / total;
    const solidity = r.area / (bw * bh);
    const aspect = bw / bh;
    return boxFrac > 0.035 && boxFrac < 0.8 &&
           solidity > 0.55 &&            // paper fills its own bounding box
           aspect > 0.1 && aspect < 9 &&
           bw > 12 && bh > 12;
  });

  if (kept.length < 2) return [];

  // reading order: top band first, then left to right within the band
  const band = h * 0.12;
  kept.sort((a, b) => (Math.abs(a.miny - b.miny) > band ? a.miny - b.miny : a.minx - b.minx));

  return kept.slice(0, MAX_IN_ONE_SHOT).map(r => ({
    x: r.minx / k, y: r.miny / k,
    w: (r.maxx - r.minx + 1) / k, h: (r.maxy - r.miny + 1) / k
  }));
}

function cropCanvas(src, box) {
  const pad = Math.round(Math.max(box.w, box.h) * 0.03);
  const x = Math.max(0, Math.round(box.x) - pad);
  const y = Math.max(0, Math.round(box.y) - pad);
  const w = Math.min(src.width  - x, Math.round(box.w) + pad * 2);
  const h = Math.min(src.height - y, Math.round(box.h) + pad * 2);
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

/* ---------- scan processor ----------
   Photographs of paper carry the room's lighting: one corner bright, another in
   shadow, the whole thing grey rather than white. We estimate that lighting and
   divide it back out, which is what makes the result read as a scan instead of a
   snapshot. The background estimate takes a high percentile per tile — paper is
   the bright majority of a tile, ink is the minority — so text is not mistaken
   for background and bleached away.                                            */
const TILES = 20;

function tileBackground(gray, w, h) {
  const bw = TILES, bh = Math.max(2, Math.round(TILES * h / w));
  const bg = new Float32Array(bw * bh);
  const hist = new Uint32Array(256);
  for (let by = 0; by < bh; by++) {
    const y0 = Math.floor(by * h / bh), y1 = Math.max(y0 + 1, Math.floor((by + 1) * h / bh));
    for (let bx = 0; bx < bw; bx++) {
      const x0 = Math.floor(bx * w / bw), x1 = Math.max(x0 + 1, Math.floor((bx + 1) * w / bw));
      hist.fill(0);
      let n = 0;
      for (let y = y0; y < y1; y++) {
        const row = y * w;
        for (let x = x0; x < x1; x++) { hist[gray[row + x] | 0]++; n++; }
      }
      const target = n * 0.80;            // 80th percentile ≈ the paper, not the ink
      let acc = 0, v = 255;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= target) { v = i; break; } }
      bg[by * bw + bx] = Math.max(v, 12);
    }
  }
  // soften the tile grid so no seams show through
  const sm = new Float32Array(bg.length);
  for (let y = 0; y < bh; y++) {
    for (let x = 0; x < bw; x++) {
      let s = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const yy = y + dy, xx = x + dx;
        if (yy >= 0 && yy < bh && xx >= 0 && xx < bw) { s += bg[yy * bw + xx]; n++; }
      }
      sm[y * bw + x] = s / n;
    }
  }
  return { bg: sm, bw, bh };
}

function sampleBilinear(g, gw, gh, fx, fy) {
  const x = Math.min(gw - 1, Math.max(0, fx)), y = Math.min(gh - 1, Math.max(0, fy));
  const x0 = Math.floor(x), y0 = Math.floor(y);
  const x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1);
  const tx = x - x0, ty = y - y0;
  const a = g[y0 * gw + x0], b = g[y0 * gw + x1];
  const c = g[y1 * gw + x0], d = g[y1 * gw + x1];
  return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
}

async function makeScan(srcCanvas) {
  try {
    const w = srcCanvas.width, h = srcCanvas.height;
    const src = srcCanvas.getContext('2d').getImageData(0, 0, w, h);
    const d = src.data;

    const gray = new Float32Array(w * h);
    for (let i = 0, p = 0; p < gray.length; i += 4, p++)
      gray[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];

    const { bg, bw, bh } = tileBackground(gray, w, h);
    const sx = (bw - 1) / Math.max(1, w - 1), sy = (bh - 1) / Math.max(1, h - 1);

    // Brightness of the paper itself — a high percentile of the tile grid.
    const sorted = Float32Array.from(bg).sort();
    const paperLevel = Math.max(40, sorted[Math.floor(sorted.length * 0.88)]);

    // Dividing out the lighting also divides out sensor noise, and the darker a
    // region is the larger that noise looms once the contrast curve stretches it —
    // which is what turns a dim desk into blotches. So the curve's strength tapers
    // off as the local background darkens. Note this is a *taper*, not a cutoff:
    // heavily shadowed paper still gets corrected, just more gently, rather than
    // being written off as background and left dark.
    for (let y = 0; y < h; y++) {
      const fy = y * sy, row = y * w;
      for (let x = 0; x < w; x++) {
        const base = sampleBilinear(bg, bw, bh, x * sx, fy);
        let punch = (base / paperLevel - 0.26) / 0.34;
        punch = punch < 0 ? 0 : punch > 1 ? 1 : punch;

        let v = gray[row + x] / base * 218;        // flatten the lighting
        v = (v - 176) * (1 + 1.15 * punch) + 214;  // then pull ink down, paper up

        const o = (row + x) * 4;
        d[o] = d[o + 1] = d[o + 2] = v < 0 ? 0 : v > 255 ? 255 : v;
        d[o + 3] = 255;
      }
    }

    const out = document.createElement('canvas');
    out.width = w; out.height = h;
    out.getContext('2d').putImageData(src, 0, 0);
    return await new Promise(r => out.toBlob(r, 'image/jpeg', 0.85));
  } catch {
    return null;                                   // fall back to the plain photo
  }
}

function loadImageEl(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('That file could not be read as an image.')); };
    img.src = url;
  });
}

async function shrinkToCanvas(file) {
  const img = await loadImageEl(file);
  const MAX = 1600;
  const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth  * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  return c;
}

async function handlePicked(file) {
  if (!file) return;
  busy(true, 'Preparing…');
  try {
    if (file.type === 'application/pdf') {
      // Already a document — a scan pass would only degrade it.
      pending = { photo: file, scan: null, chosen: 'photo',
                  type: 'application/pdf', ext: 'pdf', name: file.name };
    } else {
      const c = await shrinkToCanvas(file);
      busy(false);
      await fromCanvas(c, file.name);
      return;
    }
    busy(false);
    openDetails();
  } catch (e) {
    busy(false);
    toast(niceError(e), true);
  }
}

/* Editing a receipt that is already filed. Same fields, same VAT arithmetic,
   same folder picker as adding one — only the picture and the save differ. */
async function openReceiptEdit(r) {
  await loadFolders();

  const F = receiptFieldSet({
    description: r.description || '',
    date: String(r.receipt_date),
    amount: r.amount, vat: r.vat, net: r.net, rate: r.vat_rate,
    folderId: r.folder_id
  });

  // the picture, tappable to open it full screen where it zooms and pans
  let shot = null;
  if (!r.image_cleared) {
    let url = thumbs.get(r.file_path);
    if (!url) {
      const { data } = await db.storage.from(BUCKET).createSignedUrl(r.file_path, 3600);
      url = data && data.signedUrl;
      if (url && r.file_type !== 'application/pdf') thumbs.set(r.file_path, url);
    }
    if (url && r.file_type !== 'application/pdf') {
      shot = el('button', { class: 'pvwrap', id: 'e_photo',
        onclick: () => openReceipt(r) }, [
        el('img', { class: 'pv', alt: 'Receipt', src: url, decoding: 'async' })
      ]);
    }
  }

  const save = el('button', { class: 'btn btn-primary', id: 'e_save', text: 'Save changes' });

  save.onclick = async () => {
    const description = F.desc.value.trim();
    if (!description) { F.desc.focus(); toast('Add a short description first', true); return; }
    if (!F.date.value) { F.date.focus(); toast('Pick a date for this receipt', true); return; }
    if (!F.amount.value.trim()) { F.amount.focus(); toast('Enter the total', true); return; }
    const amt = parseMoney(F.amount.value);
    if (amt === null) { F.amount.focus(); toast('That total is not a number', true); return; }
    if (!F.vat.value.trim()) { F.vat.focus(); toast('Enter the VAT', true); return; }
    const vatAmt = parseMoney(F.vat.value);
    if (vatAmt === null) { F.vat.focus(); toast('That VAT figure is not a number', true); return; }
    if (vatAmt > amt) { F.vat.focus(); toast('VAT cannot be more than the total', true); return; }
    const netAmt = F.net.value.trim() ? parseMoney(F.net.value) : null;
    let vatRate = null;
    if (F.rate.value.trim()) {
      vatRate = parseFloat(String(F.rate.value).replace(',', '.'));
      if (!isFinite(vatRate) || vatRate < 0 || vatRate > 100) {
        F.rate.focus(); toast('That VAT rate does not look right', true); return;
      }
      vatRate = Math.round(vatRate * 100) / 100;
    }

    save.disabled = true;
    busy(true, 'Saving changes…');
    try {
      // only the fields on this form are written; the picture and everything
      // else on the record are left exactly as they are
      const res = await db.from('receipts').update({
        description,
        receipt_date: F.date.value,
        amount: amt, vat: vatAmt, net: netAmt, vat_rate: vatRate,
        folder_id: F.folder() || null
      }).eq('id', r.id);
      if (res.error) throw res.error;
      await loadMonth();
      busy(false); save.disabled = false;
      closeSheet();
      toast('Receipt updated');
    } catch (e) {
      busy(false); save.disabled = false;
      toast(niceError(e), true);
    }
  };

  sheet({
    title: 'Edit receipt',
    sub: prettyDate(String(r.receipt_date)),
    body: [
      shot,
      r.image_cleared ? el('p', { class: 'hintline',
        text: 'The picture for this one was cleared to save space. The figures are still here.' })
        : el('p', { class: 'hintline', text: 'Tap the picture to open it full screen.' }),
      ...F.rows()
    ],
    foot: [
      el('button', { class: 'btn btn-ghost', text: 'Cancel', onclick: closeSheet }),
      save
    ]
  });
}

/* The fields every receipt has, wired up once. The new-receipt sheet and the
   edit sheet both use this, so the figures behave identically in both and there
   is only one place where the VAT arithmetic lives. */
function receiptFieldSet(initial) {
  const init = initial || {};
  const desc   = el('input', { type:'text', id:'f_desc', required:'',
                    placeholder:'e.g. Timber for the deck', maxlength:'160',
                    value: init.description || '' });
  const amount = el('input', { type:'text', id:'f_amt', inputmode:'decimal', placeholder:'0.00' });
  const vat    = el('input', { type:'text', id:'f_vat', inputmode:'decimal', placeholder:'0.00' });
  const net    = el('input', { type:'text', id:'f_net', inputmode:'decimal', placeholder:'0.00' });
  const rate   = el('input', { type:'text', id:'f_rate', inputmode:'decimal', placeholder:'20',
                    value: init.rate !== null && init.rate !== undefined
                      ? String(init.rate) : String(DEFAULT_VAT_RATE) });
  const date   = el('input', { type:'date', id:'f_date',
                    value: init.date || ymd(new Date()) });
  const sums   = el('p', { class:'sumline' });

  let folderId = init.folderId || null;
  const folderBtn = el('button', { class: 'pickfolder', id: 'f_folderpick' });
  const paintFolder = () => {
    const name = folderName(folderId);
    folderBtn.innerHTML = '';
    folderBtn.appendChild(el('span', { class: 'lbl', text: name || 'None' }));
    folderBtn.appendChild(el('span', { class: 'chev' }));
  };
  folderBtn.onclick = async () => {
    await loadFolders();
    // always the overlay picker, even with no folders yet: openAddFolder() builds
    // a sheet, and building a sheet would replace the form underneath.
    pickFolderInline(id => {
      folderId = id;
      if (init.onFolder) init.onFolder(id);
      paintFolder();
    });
  };
  loadFolders().then(paintFolder);
  paintFolder();

  /* The VAT rate starts at 20% and the total is treated as VAT-inclusive, so
     typing a total fills VAT and net straight away:
        VAT = total x 20 / 120     net = total - VAT
     Nothing is read off the picture. Anything typed by hand is held and
     everything else is worked out around it. Derived figures are cleared before
     each pass so a total edited digit by digit recalculates from the new figure
     rather than from what the previous keystroke left behind. */
  const fieldFor = { net, vat, total: amount, rate };
  const held    = [];   // figures a calculation must not overwrite
  const touched = [];   // …because the user typed them here
  const seeded  = [];   // …or because they came off a receipt already on record
  const hold  = (k, list) => { if (!held.includes(k)) held.push(k); list.push(k); };
  const release = k => { const i = held.indexOf(k); if (i > -1) held.splice(i, 1); };

  const recalc = src => {
    if (src) hold(src, touched);
    // Correcting the total or the rate is a request to work the VAT out again.
    // Figures the user typed themselves stay theirs; only the ones that came off
    // the record are released and recalculated.
    if (src === 'total' || src === 'rate')
      seeded.filter(k => k !== src && !touched.includes(k)).forEach(release);
    ['net', 'vat', 'total'].forEach(k => { if (!held.includes(k)) fieldFor[k].value = ''; });

    // the rate is never overwritten by a calculation; it is a default, not a result
    const locked = held.includes('rate') ? held : held.concat('rate');
    const v = reconcile({
      net:   net.value.trim()    ? parseMoney(net.value)    : null,
      vat:   vat.value.trim()    ? parseMoney(vat.value)    : null,
      total: amount.value.trim() ? parseMoney(amount.value) : null,
      rate:  rate.value.trim()   ? parseFloat(rate.value)   : null
    }, locked);
    const set = (inp, key, dp) => {
      if (held.includes(key)) return;
      const x = v[key];
      inp.value = (x === null || x === undefined || !isFinite(x)) ? '' : Number(x).toFixed(dp);
    };
    set(net, 'net', 2); set(vat, 'vat', 2); set(amount, 'total', 2);

    // a VAT figure entered by hand defines the rate, rather than the other way round
    if (touched.includes('vat') && !touched.includes('rate') &&
        isFinite(v.net) && v.net > 0 && isFinite(v.vat))
      rate.value = String(Math.round(v.vat / v.net * 1000) / 10);

    const warn = reconcileWarning(v);
    sums.textContent = warn || '';
    sums.className = 'sumline' + (warn ? ' bad' : '');
  };
  net.oninput    = () => recalc('net');
  vat.oninput    = () => recalc('vat');
  amount.oninput = () => recalc('total');
  rate.oninput   = () => recalc('rate');

  // figures already on record are shown exactly as filed, not recomputed on sight
  const seed = (inp, key, val) => {
    if (val === null || val === undefined || !isFinite(val)) return;
    inp.value = Number(val).toFixed(2);
    hold(key, seeded);
  };
  seed(amount, 'total', init.amount);
  seed(vat,    'vat',   init.vat);
  seed(net,    'net',   init.net);
  if (init.rate !== null && init.rate !== undefined) hold('rate', seeded);
  recalc(null);

  return { desc, amount, vat, net, rate, date, sums, folderBtn, recalc,
           userTyped: k => held.includes(k),
           hold: keys => { (keys || []).forEach(k => hold(k, touched)); recalc(null); },
           folder: () => folderId,
           rows: () => [
             el('div', {}, [el('label', { for:'f_desc', text:'What is it for' }), desc]),
             el('div', { class:'row2' }, [
               el('div', {}, [el('label', { for:'f_amt', text:'Total ' + CURRENCY }), amount]),
               el('div', {}, [el('label', { for:'f_vat', text:'VAT ' + CURRENCY }), vat])
             ]),
             el('div', { class:'row2' }, [
               el('div', {}, [el('label', { for:'f_rate', text:'VAT rate %' }), rate]),
               el('div', {}, [el('label', { for:'f_net', text:'Net ' + CURRENCY }), net])
             ]),
             sums,
             el('div', {}, [el('label', { for:'f_date', text:'Date' }), date]),
             el('div', {}, [el('label', { text:'Folder' }), folderBtn])
           ] };
}

function openDetails() {
  const isPdf = pending.type === 'application/pdf';

  // Object URLs for whichever versions we have; revoked in discardPending().
  pending.urls = { photo: isPdf ? null : URL.createObjectURL(pending.photo) };

  let preview;
  if (isPdf) {
    preview = el('div', { class: 'pvfile' }, [
      el('div', {}, [
        el('b',    { text: pending.name || 'Document.pdf' }),
        el('span', { text: 'PDF · ' + Math.max(1, Math.round(pending.photo.size / 1024)) + ' KB' })
      ])
    ]);
  } else {
    // always the photograph as shot — no filter, no greyscale, no enhancement
    const img = el('img', { class: 'pv', id: 'pvimg', alt: 'Receipt preview',
                            src: pending.urls.photo });
    const shot = el('div', { class: 'pvwrap' }, [
      img,
      el('button', { class: 'icb vreset', 'aria-label': 'Reset zoom', html:
        '<svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/></svg>' })
    ]);
    preview = el('div', { style: 'display:grid;gap:8px' }, [
      shot,
      el('p', { class: 'hintline', text: 'Pinch the picture to read the small print.' })
    ]);
    // the same zoom engine the full-screen viewer uses, scoped to this picture
    setTimeout(() => bindZoomGestures(shot, img, shot), 0);
  }

  // started from inside a folder? then that is where this one is already filed,
  // and the form has to know before its fields are built
  if (pending.folderId === undefined || pending.folderId === null)
    pending.folderId = captureFolder;

  const F = receiptFieldSet({ date: captureDate || ymd(new Date()),
                              folderId: pending && pending.folderId,
                              onFolder: id => { if (pending) pending.folderId = id; } });
  const { desc, amount, vat, net, rate, date, sums, folderBtn, recalc } = F;

  const save = el('button', { class:'btn btn-primary', text:'Save receipt' });
  save.onclick = () => saveReceipt({ desc, amount, vat, net, rate, date, save });

  const readbox = el('div', { class: 'readbox reading' });

  const inBatch = !!batch;
  sheet({
    title: inBatch ? `Receipt ${batch.i + 1} of ${batch.items.length}` : 'New receipt',
    onClose: () => { if (inBatch) abandonBatch(); else discardPending(); },
    body: [
      preview,
      readbox,          // what was read sits right under the picture, before the fields
      ...F.rows()
    ],
    foot: [
      inBatch
        ? el('button', { class:'btn btn-ghost', text:'Skip', onclick: () => {
            freeItem(batch.items[batch.i]);
            batch.skipped++; batch.i++;
            pending = null;
            nextInBatch();
          } })
        : el('button', { class:'btn btn-ghost', text:'Cancel', onclick: discardPending }),
      save
    ]
  });

  // hand the reader its fields, then let it work while the sheet is already up
  pending.fields = { date, amount, vat, net, rate, readbox,
    userTyped: F.userTyped, afterRead: F.hold };
  if (isPdf) {
    renderRead(readbox, null);                    // nothing to OCR in a PDF
  } else {
    renderRead(readbox, 'reading');
    readToken++;
    readReceipt(pending, readToken);
  }
  setTimeout(() => desc.focus(), 280);
}

const WARN_ICON =
  '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/>' +
  '<path d="M10.3 3.9L2.4 17a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>';

function renderRead(box, state, found) {
  box.innerHTML = '';
  box.className = 'readbox' + (state === 'reading' ? ' reading' : found ? '' : ' none');

  if (state === 'reading') {
    box.appendChild(el('div', { class: 'rspin' }));
    box.appendChild(el('div', { class: 'rtext' }, [
      el('b', { text: 'Reading the receipt…' }),
      el('span', { text: 'Carry on filling this in — you can save at any point.' })
    ]));
    return;
  }

  if (!found) {
    box.appendChild(el('div', { class: 'rtext' }, [
      el('b', { text: state === 'slow' ? 'Reading took too long'
                : state === 'unavailable' ? 'Could not read this one'
                : 'Nothing could be read' }),
      el('span', { text: state === null
        ? 'PDFs are filed as they are. Fill the figures in below.'
        : 'Fill the figures in below — everything else works as normal.' })
    ]));
    return;
  }

  const bits = [];
  const line = (label, value, note) => bits.push(el('span', { html:
    label + ' <code>' + value + '</code>' + (note ? ' — ' + note : '') }));

  if (found.date)  line('Date', found.dateRaw, prettyDate(found.date));
  if (found.total !== null) line('Total', money(found.total), 'printed');
  if (found.invoiceNo) line('Invoice no', found.invoiceNo);
  bits.push(el('span', { class: 'unknown',
    text: 'VAT is worked out from the rate below, not read off the picture. '
        + 'Change the rate if this one is not at ' + DEFAULT_VAT_RATE + '%.' }));

  box.appendChild(el('div', { class: 'rmark', html: WARN_ICON }));
  box.appendChild(el('div', { class: 'rtext' }, [
    el('b', { text: 'Check this before saving' }),
    ...bits
  ]));
}

function applyRead(target) {
  const f = target.fields;
  if (!f || target !== pending) return;
  const r = target.read || {};

  if (!r.ok) { renderRead(f.readbox, r.why); return; }

  const anything = r.date || (r.total !== null && r.total !== undefined);
  if (!anything) { renderRead(f.readbox, 'empty'); return; }

  if (r.date) f.date.value = r.date.date;

  // the total is the only figure taken from the picture, and only if the user
  // has not already typed one; VAT and net then follow from the rate on the form
  const read = [];
  if (f.amount && !(f.userTyped && f.userTyped('total')) &&
      r.total !== null && r.total !== undefined && isFinite(r.total)) {
    f.amount.value = Number(r.total).toFixed(2);
    read.push('total');
  }
  if (f.afterRead) f.afterRead(read);

  target.meta = {
    invoice_no: r.invoiceNo || null,
    currency: r.currency || null
  };

  renderRead(f.readbox, 'done', {
    date: r.date && r.date.date, dateRaw: r.date && r.date.raw,
    total: r.total ?? null,
    invoiceNo: r.invoiceNo
  });
}

function discardPending() {
  freeItem(pending);
  if (batch) abandonBatch();
  pending = null;
  closeSheet();
}

/* Accepts "12.50", "12,50", "£12.50", "1,234.56" and "1,200".
   A lone comma is the decimal point only when one or two digits follow it —
   "12,50" is twelve fifty, but "1,200" is twelve hundred, not one pound twenty. */
function parseMoney(raw) {
  let s = String(raw).replace(/[^0-9.,]/g, '');
  if (s.includes(',') && s.includes('.')) {
    // whichever separator comes last is the decimal point
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '');
  } else if (s.includes(',')) {
    s = /^[0-9]*,[0-9]{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  const parsed = parseFloat(s);
  return isNaN(parsed) ? null : Math.round(parsed * 100) / 100;
}

async function saveReceipt({ desc, amount, vat, net, rate, date, save }) {
  const description = desc.value.trim();
  if (!description) { desc.focus(); toast('Add a short description first', true); return; }

  // what it is for, VAT, total and date are required. Supplier is not.
  if (!date.value) { date.focus(); toast('Pick a date for this receipt', true); return; }
  const dateStr = date.value;

  if (!amount.value.trim()) { amount.focus(); toast('Enter the total', true); return; }
  const amt = parseMoney(amount.value);
  if (amt === null) { amount.focus(); toast('That total is not a number', true); return; }

  if (!vat || !vat.value.trim()) {
    vat && vat.focus(); toast('Enter the VAT — it defaults to 20% of the total', true); return;
  }
  const vatAmt = parseMoney(vat.value);
  if (vatAmt === null) { vat.focus(); toast('That VAT figure is not a number', true); return; }
  if (vatAmt > amt) { vat.focus(); toast('VAT cannot be more than the total', true); return; }
  let netAmt = null;
  if (net && net.value.trim()) {
    netAmt = parseMoney(net.value);
    if (netAmt === null) { net.focus(); toast('That net figure is not a number', true); return; }
  }
  let vatRate = null;
  if (rate && rate.value.trim()) {
    vatRate = parseFloat(String(rate.value).replace(',', '.'));
    if (!isFinite(vatRate) || vatRate < 0 || vatRate > 100) {
      rate.focus(); toast('That VAT rate does not look right', true); return;
    }
    vatRate = Math.round(vatRate * 100) / 100;
  }

  if (saving) return;                 // a second tap cannot start a second save
  saving = true;
  save.disabled = true;
  busy(true, 'Saving receipt…');
  const [y, m] = dateStr.split('-');
  const path = `${y}/${m}/${crypto.randomUUID()}.${pending.ext}`;

  try {
    const chosenBlob = pending.photo;   // the original colour photograph
    const up = await db.storage.from(BUCKET)
      .upload(path, chosenBlob, { contentType: pending.type, upsert: false });
    if (up.error) throw up.error;

    const { error } = await db.from('receipts').insert({
      receipt_date: dateStr,
      description,
      amount: amt,
      vat: vatAmt,
      net: netAmt,
      vat_rate: vatRate,
      invoice_no: (pending.meta && pending.meta.invoice_no) || null,
      currency: (pending.meta && pending.meta.currency) || 'GBP',
      folder_id: pending.folderId || null,
      file_path: path,
      file_type: pending.type,
      file_size: chosenBlob.size,
      uploaded_by: session.user.id,
      uploader_name: session.user.email
    });
    if (error) {
      await db.storage.from(BUCKET).remove([path]);   // don't leave an orphan file
      throw error;
    }

    const d = new Date(dateStr + 'T12:00:00');
    if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) view = d;

    if (batch) {
      freeItem(pending);
      pending = null;
      batch.saved++; batch.i++;
      await nextInBatch();          // straight on to the next one in the photo
    } else {
      discardPending();
      await loadMonth();
      toast('Saved to ' + prettyDate(dateStr));
    }
  } catch (e) {
    toast(niceError(e), true);
  } finally {
    saving = false;
    save.disabled = false;
    busy(false);          // the receipt is filed and the sheet is closed: always clear
  }
}

/* ============================================================
   MONTHLY EXPORT  →  one PDF  →  share sheet
   ============================================================ */
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
    s.onload  = () => res(window.PDFLib);
    s.onerror = () => rej(new Error('Could not load the PDF builder. Check your connection and try again.'));
    document.head.appendChild(s);
  });
}

/* pdf-lib's built-in fonts only speak WinAnsi — strip anything they'd choke on */
const winAnsi = s => (s || '')
  .replace(/[‘’‚]/g, "'")
  .replace(/[“”„]/g, '"')
  .replace(/[–—]/g, '-')
  .replace(/…/g, '...')
  .replace(/[^\x20-\x7E\xA0-\xFF]/g, '');

function wrap(text, font, size, maxW) {
  const words = winAnsi(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const w of words) {
    const next = line ? line + ' ' + w : w;
    if (font.widthOfTextAtSize(next, size) > maxW && line) { lines.push(line); line = w; }
    else line = next;
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}

/* ============================================================
   REPORTS
   One PDF, however the receipts were chosen. Months, folders and individual
   receipts are three ways of picking the same records; the selection is unioned
   and de-duplicated, and every total is summed from the records themselves.
   ============================================================ */

function sanitiseRows(list) {
  const seen = new Set();
  return list
    .filter(r => r && r.id && !seen.has(r.id) && seen.add(r.id))
    .sort((a, b) => String(a.receipt_date).localeCompare(String(b.receipt_date)) ||
                    String(a.created_at).localeCompare(String(b.created_at)));
}

function monthLabelOf(key) {
  const [y, m] = key.split('-');
  return MONTHS[Number(m) - 1] + ' ' + y;
}

/* "January 2026 – March 2026" when they run on, otherwise a plain list */
function describeMonths(keys) {
  if (!keys.length) return '';
  const sorted = [...keys].sort();
  const idx = k => Number(k.slice(0, 4)) * 12 + Number(k.slice(5, 7)) - 1;
  const runs = idx(sorted[sorted.length - 1]) - idx(sorted[0]) + 1 === sorted.length;
  if (sorted.length > 1 && runs)
    return monthLabelOf(sorted[0]) + ' – ' + monthLabelOf(sorted[sorted.length - 1]);
  return sorted.map(monthLabelOf).join(', ');
}

async function exportMonth() {
  const key = `${view.getFullYear()}-${String(view.getMonth() + 1).padStart(2, '0')}`;
  await buildReport({
    rows: rows.slice(),
    title: 'Receipt report',
    scope: `${MONTHS[view.getMonth()]} ${view.getFullYear()}`,
    monthKeys: [key],
    filename: `Receipts ${MONTHS[view.getMonth()]} ${view.getFullYear()}.pdf`
  });
}

/* Select Months: tick any months — they need not run on — and get one combined
   PDF. Nothing here builds a second report system; the ticked month keys go
   straight into the same buildReport() the app has always used. */
async function openMonthExport() {
  busy(true, 'Loading…');
  let all;
  try {
    const res = await db.from('receipts').select('*').order('receipt_date', { ascending: false });
    if (res.error) throw res.error;
    all = res.data || [];
  } catch (e) { busy(false); toast(niceError(e), true); return; }
  busy(false);

  if (!all.length) { toast('Nothing filed yet'); return; }

  const months = [...new Set(all.map(r => String(r.receipt_date).slice(0, 7)))].sort().reverse();
  const picked = new Set();
  const inMonth = k => all.filter(r => String(r.receipt_date).slice(0, 7) === k);

  let summary, body, foot;

  const paint = () => {
    const chosen = sanitiseRows(months.filter(k => picked.has(k)).flatMap(inMonth));
    const t = sumRows(chosen);

    summary.innerHTML = '';
    summary.appendChild(el('div', { class: 'ftotals' }, [
      el('div', {}, [el('span', { text: 'Months' }),   el('b', { text: String(picked.size) })]),
      el('div', {}, [el('span', { text: 'Receipts' }), el('b', { text: String(t.n) })]),
      el('div', {}, [el('span', { text: 'VAT' }),      el('b', { text: money(t.vat) })]),
      el('div', {}, [el('span', { text: 'Total' }),
                     el('b', { class: 'accent', text: money(t.total) })])
    ]));

    body.innerHTML = '';
    body.appendChild(el('div', { class: 'card' }, months.map(k => {
      const on = picked.has(k);
      const sm = sumRows(inMonth(k));
      return el('button', { class: 'selrow' + (on ? ' on' : ''),
        onclick: () => { on ? picked.delete(k) : picked.add(k); paint(); } }, [
        el('span', { class: 'pick' + (on ? ' on' : '') }),
        el('div', { class: 'selmeta' }, [
          el('b', { text: monthLabelOf(k) }),
          el('span', { text: `${sm.n} receipt${sm.n === 1 ? '' : 's'}  ·  VAT ${money(sm.vat)}` })
        ]),
        el('span', { class: 'ftot', text: money(sm.total) })
      ]);
    })));

    foot.innerHTML = '';
    const go = el('button', { class: 'btn btn-primary btn-full',
      text: picked.size ? `Download PDF · ${picked.size} month${picked.size === 1 ? '' : 's'}`
                        : 'Select a month' });
    go.disabled = !picked.size;
    go.onclick = () => {
      const keys = months.filter(k => picked.has(k));      // oldest last, sorted below
      closeSheet();
      buildReport({
        rows: chosen,
        title: 'Receipt report',
        scope: describeMonths(keys),
        monthKeys: keys,
        filename: keys.length === 1
          ? `Receipts ${monthLabelOf(keys[0])}.pdf`
          : 'Receipt report.pdf'
      });
    };
    foot.appendChild(go);
  };

  summary = el('div', { class: 'card selsum' });
  body = el('div', { class: 'selbody' });
  foot = el('div', { class: 'sfoot' });

  const card = sheet({
    title: 'Select Months',
    sub: 'One PDF, however many you tick',
    body: [ summary, body ]
  });
  card.appendChild(foot);
  paint();
}

/* The report builder: three ways of picking, all combinable, one PDF out. */
async function openReportBuilder() {
  busy(true, 'Loading…');
  await loadFolders();
  let all;
  try {
    const res = await db.from('receipts').select('*').order('receipt_date', { ascending: false });
    if (res.error) throw res.error;
    all = res.data || [];
  } catch (e) { busy(false); toast(niceError(e), true); return; }
  busy(false);

  if (!all.length) { toast('Nothing filed yet'); return; }

  const months = [...new Set(all.map(r => String(r.receipt_date).slice(0, 7)))].sort().reverse();
  const pickedMonths = new Set(), pickedFolders = new Set(), pickedReceipts = new Set();

  // union of the three, de-duplicated by id
  const resolve = () => {
    if (!pickedMonths.size && !pickedFolders.size && !pickedReceipts.size) return [];
    return all.filter(r =>
      pickedMonths.has(String(r.receipt_date).slice(0, 7)) ||
      (r.folder_id && pickedFolders.has(r.folder_id)) ||
      pickedReceipts.has(r.id));
  };

  let summary, foot, body;

  const paint = () => {
    const chosen = sanitiseRows(resolve());
    const s = sumRows(chosen);
    summary.innerHTML = '';
    summary.appendChild(el('div', { class: 'ftotals' }, [
      el('div', {}, [el('span', { text: 'Receipts' }), el('b', { text: String(s.n) })]),
      el('div', {}, [el('span', { text: 'Net' }),      el('b', { text: money(s.net) })]),
      el('div', {}, [el('span', { text: 'VAT' }),      el('b', { text: money(s.vat) })]),
      el('div', {}, [el('span', { text: 'Total' }),    el('b', { class: 'accent', text: money(s.total) })])
    ]));
    foot.innerHTML = '';
    const go = el('button', { class: 'btn btn-primary btn-full',
      text: s.n ? `Create PDF · ${s.n} receipt${s.n === 1 ? '' : 's'}` : 'Nothing selected' });
    go.disabled = !s.n;
    go.onclick = () => {
      const mKeys = [...pickedMonths];
      const fNames = [...pickedFolders].map(id => folderName(id)).filter(Boolean);
      const parts = [];
      if (mKeys.length) parts.push(describeMonths(mKeys));
      if (!mKeys.length && !fNames.length) parts.push('Selected receipts');
      closeSheet();
      buildReport({
        rows: chosen,
        title: 'Receipt report',
        scope: parts.join('  ·  '),
        monthKeys: mKeys,          // every month ticked, even one that turns out empty
        folderScope: fNames.join(', ') || null,
        filename: 'Receipt report.pdf'
      });
    };
    foot.appendChild(go);
  };

  const toggleRow = (label, sub, set, key, extra) => {
    const on = set.has(key);
    return el('button', { class: 'selrow' + (on ? ' on' : ''), onclick: () => {
      on ? set.delete(key) : set.add(key); rebuild();
    } }, [
      el('span', { class: 'pick' + (on ? ' on' : '') }),
      el('div', { class: 'selmeta' }, [
        el('b', { text: label }),
        el('span', { text: sub })
      ]),
      extra ? el('span', { class: 'ftot', text: extra }) : null
    ]);
  };

  const section = (title, rowsUi) => rowsUi.length ? el('div', { class: 'grp' }, [
    el('h4', { text: title }),
    el('div', { class: 'card' }, rowsUi)
  ]) : null;

  const rebuild = () => {
    body.innerHTML = '';

    body.appendChild(section('Months', months.map(k => {
      const inMonth = all.filter(r => String(r.receipt_date).slice(0, 7) === k);
      const s = sumRows(inMonth);
      return toggleRow(monthLabelOf(k),
        `${s.n} · VAT ${money(s.vat)}`, pickedMonths, k, money(s.total));
    })));

    const fRows = folders.map(f => {
      const inF = all.filter(r => r.folder_id === f.id);
      const s = sumRows(inF);
      return toggleRow(f.name, s.n ? `${s.n} · VAT ${money(s.vat)}` : 'empty',
                       pickedFolders, f.id, s.n ? money(s.total) : '—');
    });
    const fSec = section('Folders', fRows);
    if (fSec) body.appendChild(fSec);

    body.appendChild(section('Individual receipts', all.slice(0, 40).map(r =>
      toggleRow(r.description || 'Receipt',
        [prettyDate(r.receipt_date), folderName(r.folder_id) || 'Unfiled'].join('  ·  '),
        pickedReceipts, r.id,
        r.amount != null ? money(r.amount) : '—')
    )));

    if (all.length > 40) body.appendChild(el('p', { class: 'hintline',
      text: `Showing the 40 most recent for individual picking. Older ones are still included via their month or folder.` }));

    paint();
  };

  summary = el('div', { class: 'card selsum' });
  body = el('div', { class: 'selbody' });
  foot = el('div', { class: 'sfoot' });

  const card = sheet({
    title: 'Create report',
    sub: 'Combine any of these',
    body: [ summary, body ]
  });
  card.appendChild(foot);
  rebuild();
}

async function buildReport({ rows: list, title, scope, monthKeys, folderScope, filename }) {
  const picked = sanitiseRows(list || []);
  if (!picked.length) { toast('Nothing to export in that selection'); return; }

  busy(true, 'Building your PDF…', 0);
  try {
    const { PDFDocument, StandardFonts, rgb } = await loadPdfLib();
    const doc  = await PDFDocument.create();
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const bold = await doc.embedFont(StandardFonts.HelveticaBold);

    const W = 595.28, H = 841.89, M = 46;
    const ink = rgb(0.09, 0.10, 0.12);
    const dim = rgb(0.42, 0.45, 0.49);
    const acc = rgb(0.02, 0.45, 0.41);
    const rule = rgb(.85, .87, .89);

    // every figure below is summed from the stored records
    const sums = sumRows(picked);
    const missing = picked.filter(r => r.amount === null || r.amount === undefined).length;
    const noVat   = picked.filter(r => r.vat === null || r.vat === undefined).length;
    const clearedCount = picked.filter(r => r.image_cleared).length;

    /* ---------------- summary page ---------------- */
    let page = doc.addPage([W, H]);
    let y = H - M;

    page.drawText(winAnsi((title || 'Receipt report').toUpperCase()),
      { x: M, y: y - 24, size: 24, font: bold, color: ink });
    y -= 36;
    if (scope) {
      page.drawText(winAnsi(scope), { x: M, y: y - 14, size: 15, font, color: dim });
      y -= 24;
    }
    if (folderScope) {
      page.drawText(winAnsi('Folders: ' + folderScope), { x: M, y: y - 12, size: 11, font, color: dim });
      y -= 20;
    }
    y -= 14;
    page.drawLine({ start:{x:M,y}, end:{x:W-M,y}, thickness:1, color: rule });
    y -= 30;

    const figure = (label, value, big) => {
      page.drawText(winAnsi(label), { x: M, y, size: 11, font, color: dim });
      const f = big ? bold : font, sz = big ? 15 : 13;
      const txt = winAnsi(value);
      page.drawText(txt, { x: W - M - f.widthOfTextAtSize(txt, sz), y: y - (big ? 2 : 0),
                           size: sz, font: f, color: big ? acc : ink });
      y -= big ? 26 : 21;
    };

    // Receipts, VAT and Total only — net is kept in the records, not shown here
    figure('Receipts', String(sums.n));
    figure('VAT', money(sums.vat));
    page.drawLine({ start:{x:M,y:y+7}, end:{x:W-M,y:y+7}, thickness:.6, color: rule });
    y -= 6;
    figure('Total', money(sums.total), true);

    const notes = [];
    if (missing) notes.push(`${missing} without a recorded total`);
    if (noVat)   notes.push(`${noVat} without a VAT figure`);
    if (clearedCount) notes.push(`${clearedCount} with the image cleared`);
    if (notes.length) {
      y -= 8;
      page.drawText(winAnsi(notes.join('  ·  ')), { x: M, y, size: 9, font, color: dim });
      y -= 18;
    }

    /* ---------------- month by month ----------------
       Every figure here is summed from the de-duplicated receipt records, using
       the net, VAT and total stored on each one. Nothing is read off an image and
       no VAT is inferred from a percentage. A month that was ticked but holds no
       receipts is still listed, at zero, so the selection is fully accounted for. */
    const mKeys = [...new Set(monthKeys || [])].sort();
    if (mKeys.length > 1) {          // a single month is already named at the top
      y -= 16;
      page.drawText('MONTH BY MONTH', { x: M, y, size: 8, font: bold, color: dim });
      y -= 14;

      const mCount = W - M - 146, mVat = W - M - 74, mTot = W - M;
      const right = (txt, x, sz, f, colour) => {
        const t = winAnsi(txt);
        page.drawText(t, { x: x - f.widthOfTextAtSize(t, sz), y, size: sz, font: f, color: colour });
      };

      page.drawText('MONTH', { x: M, y, size: 8, font: bold, color: dim });
      [['RECEIPTS', mCount], ['VAT', mVat], ['TOTAL', mTot]]
        .forEach(([h, x]) => right(h, x, 8, bold, dim));
      y -= 8;
      page.drawLine({ start:{x:M,y}, end:{x:W-M,y}, thickness:.6, color: rule });
      y -= 15;

      const perMonth = mKeys.map(k => ({
        key: k,
        s: sumRows(picked.filter(r => String(r.receipt_date).slice(0, 7) === k))
      }));

      for (const { key, s } of perMonth) {
        if (y < M + 90) { page = doc.addPage([W, H]); y = H - M; }
        page.drawText(winAnsi(monthLabelOf(key)), { x: M, y, size: 10.5, font, color: ink });
        right(String(s.n), mCount, 10.5, font, s.n ? dim : rgb(.62, .65, .68));
        right(money(s.vat),   mVat, 10.5, font, dim);
        right(money(s.total), mTot, 10.5, font, ink);
        y -= 17;
      }

      // the TOTAL block sits underneath the months and covers the whole report
      y -= 3;
      page.drawLine({ start:{x:M,y:y+6}, end:{x:W-M,y:y+6}, thickness:1, color: rule });
      y -= 9;
      page.drawText('TOTAL', { x: M, y, size: 11, font: bold, color: ink });
      right(String(sums.n),     mCount, 11, bold, ink);
      right(money(sums.vat),    mVat,   11, bold, ink);
      right(money(sums.total),  mTot,   11, bold, acc);
      y -= 18;

      const outside = picked.length - perMonth.reduce((a, m) => a + m.s.n, 0);
      if (outside > 0) {
        page.drawText(winAnsi(`Plus ${outside} receipt${outside === 1 ? '' : 's'} `
          + 'picked by folder or individually, from other months.'),
          { x: M, y, size: 9, font, color: dim });
        y -= 16;
      }
    }

    y -= 14;
    if (y < M + 80) { page = doc.addPage([W, H]); y = H - M; }
    page.drawLine({ start:{x:M,y}, end:{x:W-M,y}, thickness:.6, color: rule });
    y -= 20;

    /* ---------------- itemised list ---------------- */
    const colDate = M, colDesc = M + 74;
    const colTot = W - M, colVat = W - M - 66;
    const descW = colVat - colDesc - 78;

    const header = () => {
      page.drawText('DATE', { x: colDate, y, size: 8, font: bold, color: dim });
      page.drawText('WHAT IT IS FOR', { x: colDesc, y, size: 8, font: bold, color: dim });
      [['VAT', colVat], ['TOTAL', colTot]].forEach(([h, x]) =>
        page.drawText(h, { x: x - bold.widthOfTextAtSize(h, 8), y, size: 8, font: bold, color: dim }));
      y -= 8;
      page.drawLine({ start:{x:M,y}, end:{x:W-M,y}, thickness:.6, color: rule });
      y -= 16;
    };
    header();

    for (const r of picked) {
      const lines = wrap(r.description || 'Receipt', font, 10, descW);
      const sub = [folderName(r.folder_id), r.image_cleared ? 'image cleared' : null]
        .filter(Boolean).join('  ·  ');
      const need = lines.length * 13 + (sub ? 11 : 0) + 6;
      if (y - need < M + 30) { page = doc.addPage([W, H]); y = H - M; header(); }

      const [, mm, dd] = String(r.receipt_date).split('-');
      page.drawText(`${dd}/${mm}`, { x: colDate, y, size: 10, font, color: dim });
      lines.forEach((ln, i) =>
        page.drawText(ln, { x: colDesc, y: y - i * 12, size: 10, font, color: ink }));
      if (sub) page.drawText(winAnsi(sub),
        { x: colDesc, y: y - lines.length * 12, size: 8.5, font, color: dim });

      const num = (val, x, colour) => {
        if (val === null || val === undefined) return;
        const s = winAnsi(CURRENCY + Number(val).toFixed(2));
        page.drawText(s, { x: x - font.widthOfTextAtSize(s, 10), y, size: 10, font, color: colour });
      };
      num(r.vat, colVat, dim);
      num(r.amount, colTot, ink);
      y -= need;
    }

    /* ---------------- the receipts themselves ---------------- */
    const withImages = picked.filter(r => !r.image_cleared);
    const paths = withImages.map(r => r.file_path);
    let urlFor = new Map();
    if (paths.length) {
      // signed URLs come back in batches so a big report does not blow the request
      for (let i = 0; i < paths.length; i += 100) {
        const { data: signed, error: sErr } =
          await db.storage.from(BUCKET).createSignedUrls(paths.slice(i, i + 100), 3600);
        if (sErr) throw sErr;
        (signed || []).forEach(o => o.signedUrl && urlFor.set(o.path, o.signedUrl));
      }
    }

    const skipped = [];
    for (let i = 0; i < withImages.length; i++) {
      const r = withImages[i];
      busy(true, `Adding receipt ${i + 1} of ${withImages.length}…`, (i + 1) / withImages.length);
      const url = urlFor.get(r.file_path);
      if (!url) { skipped.push(r); continue; }
      try {
        const bytes = new Uint8Array(await (await fetch(url)).arrayBuffer());

        if (r.file_type === 'application/pdf') {
          const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
          const copied = await doc.copyPages(src, src.getPageIndices());
          copied.forEach(pg => doc.addPage(pg));
          continue;
        }

        const isPng = bytes[0] === 0x89 && bytes[1] === 0x50;
        const img = isPng ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);

        const pg = doc.addPage([W, H]);
        const capTop = H - M;
        pg.drawText(winAnsi(prettyDate(r.receipt_date)),
          { x: M, y: capTop - 11, size: 9, font, color: dim });

        const titleLines = wrap(r.description || 'Receipt', bold, 14, W - M * 2 - 90);
        titleLines.slice(0, 2).forEach((ln, k) =>
          pg.drawText(ln, { x: M, y: capTop - 30 - k * 17, size: 14, font: bold, color: ink }));

        if (r.amount !== null && r.amount !== undefined) {
          const a = winAnsi(CURRENCY + Number(r.amount).toFixed(2));
          pg.drawText(a, { x: W - M - bold.widthOfTextAtSize(a, 14), y: capTop - 30,
                           size: 14, font: bold, color: acc });
        }
        const sub = [folderName(r.folder_id),
                     r.vat != null ? 'VAT ' + money(r.vat) : null,
                     r.uploader_name].filter(Boolean).join('  ·  ');
        const capBottom = capTop - 30 - Math.min(titleLines.length, 2) * 17 - 4;
        if (sub) pg.drawText(winAnsi(sub), { x: M, y: capBottom, size: 9, font, color: dim });

        const boxTop = capBottom - 16;
        const boxH = boxTop - M, boxW = W - M * 2;
        const k = Math.min(boxW / img.width, boxH / img.height);
        pg.drawImage(img, { x: M + (boxW - img.width * k) / 2,
                            y: M + (boxH - img.height * k) / 2,
                            width: img.width * k, height: img.height * k });
      } catch {
        skipped.push(r);
      }
    }

    if (skipped.length) {
      const pg = doc.addPage([W, H]);
      pg.drawText(winAnsi('Could not be included'), { x: M, y: H - M - 18, size: 15, font: bold, color: ink });
      let yy = H - M - 44;
      skipped.forEach(r => {
        pg.drawText(winAnsi(`${r.receipt_date}  —  ${r.description || 'Receipt'}`),
          { x: M, y: yy, size: 10, font, color: dim });
        yy -= 15;
      });
    }

    busy(true, 'Finishing up…');
    const bytes = await doc.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    busy(false);

    const name = filename || 'Receipt report.pdf';
    const file = new File([blob], name, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; }
      catch (err) { if (err && err.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
    toast('PDF downloaded');
  } catch (e) {
    busy(false);
    toast(niceError(e), true);
  }
}

    '<div style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center">' +

    '</p></div></div>';
}

(async function boot() {
  // Both screens start hidden, so until one of them is painted the page is
  // plain black. Show the spinner first: a slow start then looks like a slow
  // start, and anything that goes wrong lands on the message below.
  busy(true, 'Starting up…');

  try {
    await loadSupabase();
  } catch {
    busy(false);
    fatal('Receipts needs an internet connection the first time it opens. ' +
          'Check your signal and reopen the app.');
    return;
  }

  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    db.auth.onAuthStateChange((_evt, s) => {
      const wasIn = !!session;
      session = s;
      if (!booted) return;                     // boot paints the first screen itself
      if (session && !wasIn) showApp();
      else if (!session && wasIn) showAuth();
    });

    // a stored session that cannot be checked must not hold the app on a blank
    // screen — fall back to the sign-in form, which always works
    const { data } = await Promise.race([
      db.auth.getSession(),
      new Promise(r => setTimeout(() => r({ data: { session: null } }), 8000))
    ]);
    session = data && data.session;
    booted = true;
    if (session) showApp(); else showAuth();
  } catch (e) {
    busy(false);
    fatal('Something stopped Receipts starting up. Close it and open it again. '
        + '(' + niceError(e) + ')');
  }
})();
</script>
</body>
</html>
