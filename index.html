<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* iOS dark-mode system palette: true-black ground, grouped cells above it */
  --bg:#000000;
  --surface:#1c1c1e;      /* grouped cell */
  --surface-2:#2c2c2e;    /* field / elevated */
  --surface-3:#3a3a3c;    /* control */
  --line:rgba(84,84,88,.65);
  --text:#ffffff;
  --muted:rgba(235,235,245,.6);
  --faint:rgba(235,235,245,.3);
  /* two tones: the bright one for text and tint on black, a deep one for filled
     surfaces where white type has to sit on top of it */
  --accent:#2dd4bf;
  --accent-fill:#0f766e;
  --on-accent:#ffffff;
  --danger:#ff453a;
  --warn:#f0a02a;
  --radius:12px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
  /* kills double-tap-to-zoom and the 300ms tap delay, keeps normal scrolling */
  touch-action:manipulation;
}
/* lists scroll with momentum and do not drag the page behind them */
.sbody,.rclist,.selbody,.dpanel,main{overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch}
.rlist img,.rclist img{background:var(--surface-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
input,textarea,select{
  width:100%; background:var(--surface-2); border:0;
  border-radius:10px; padding:12px 14px; font-size:17px; outline:none;
  -webkit-appearance:none; appearance:none;
}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
label{display:block;font-size:13px;font-weight:400;color:var(--muted);margin:0 0 6px 3px}
.hide{display:none!important}

/* iOS grouped-list section: header label, then a rounded card of rows */
.grp{display:flex;flex-direction:column;gap:7px}
.grp > h4{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);padding-left:16px;margin:0}
.card{background:var(--surface);border-radius:var(--radius);overflow:hidden}
.card > *{position:relative}
.card > * + *::before{content:"";position:absolute;top:0;left:16px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:12px;padding:15px 18px;font-weight:600;font-size:17px;
  background:var(--surface-2);transition:opacity .15s;letter-spacing:-.01em}
.btn:active{opacity:.55}
.btn-primary{background:var(--accent-fill);color:var(--on-accent)}
.btn-ghost{background:var(--surface-2);color:var(--text)}
.btn-danger{background:var(--surface-2);color:var(--danger)}
.ask{color:var(--muted);font-size:15px;line-height:1.5}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-full{width:100%}

/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--sat) + 32px) 24px calc(var(--sab) + 32px);max-width:420px;margin:0 auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:34px}
.brand img{width:66px;height:66px;border-radius:17px}
.brand h1{font-size:32px;font-weight:700;letter-spacing:-.03em}
.brand p{color:var(--muted);font-size:15.5px;text-align:center}
#auth form{display:flex;flex-direction:column;gap:15px}
.swap{text-align:center;color:var(--muted);font-size:14.5px;margin-top:20px}
.swap button{color:var(--accent);font-weight:600}
.msg{border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.45;
  background:var(--surface)}
.msg-err{color:#ff6961}
.msg-ok{color:var(--accent)}

/* ---------- app chrome ---------- */
/* phone-first; on a laptop it stays a phone-width column rather than stretching */
#app,#plan,#site{min-height:100%;display:flex;flex-direction:column;
  max-width:540px;margin:0 auto;width:100%}
@media(min-width:560px){
  #app,#plan,#site{border-inline:1px solid var(--line)}
  .cell{aspect-ratio:1/.86}
}
header{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.8);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);padding:calc(var(--sat) + 10px) 12px 11px}
.hrow{display:flex;align-items:center;gap:4px}
.mnav{display:flex;align-items:center;gap:2px;flex:1;min-width:0;justify-content:center}
.mtitle{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--text);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  padding:5px 9px;border-radius:9px;display:flex;align-items:center;gap:5px}
.mtitle::after{content:"";width:0;height:0;flex:none;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--muted);margin-top:2px}
.mtitle:active{background:var(--surface-2)}
/* 44px is Apple's minimum comfortable target; the glyph stays 19px so the
   design does not get heavier, only easier to hit. */
.icb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  color:var(--muted);flex:none;-webkit-tap-highlight-color:transparent}
.icb:active{background:var(--surface-2)}
.icb svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.totals{display:flex;margin:11px 4px 0;background:var(--surface);
  border-radius:10px;padding:9px 6px}
.totals div{flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;gap:1px;padding:0 2px}
.totals div + div{border-left:1px solid var(--line)}
.totals span{font-size:11px;color:var(--muted);white-space:nowrap}
.totals b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;white-space:nowrap}
.totals b.accent{color:var(--accent)}

/* ---------- calendar ---------- */
main{flex:1;padding:16px 12px 0}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.dow span{text-align:center;font-size:11px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--faint);padding:5px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cell{aspect-ratio:1;border-radius:10px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  position:relative;transition:transform .1s}
.cell:active{transform:scale(.93)}
.cell.blank{background:none;pointer-events:none}
.cell .n{font-size:16px;font-weight:400;font-variant-numeric:tabular-nums;color:var(--muted)}
.cell.today{background:var(--accent-fill)}
.cell.today .n{color:var(--on-accent);font-weight:700}
.cell.today .pip{background:var(--on-accent)}
.cell.today .pip.more{color:var(--on-accent)}
.cell.has{background:var(--surface-2)}
.cell.has .n{color:var(--text);font-weight:600}
.cell.today.has{background:var(--accent-fill)}
.pips{display:flex;gap:3px;height:5px;align-items:center}
.pip{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.pip.more{width:auto;height:auto;border-radius:0;background:none;
  font-size:9px;font-weight:700;color:var(--accent);line-height:1}

#recent{margin:26px 0 0}
.rechead{display:flex;align-items:center;gap:6px;width:100%;padding:0 16px 8px;
  text-align:left}
.rechead h3{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted)}
.rechead .chev{width:7px;height:7px;flex:none;margin-bottom:1px;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(-45deg)}
.rechead:active h3,.rechead:active .chev{opacity:.55}

/* ---------- bottom bar ---------- */
.bar{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;
  padding:14px 12px calc(var(--sab) + 14px);margin-top:22px;
  background:linear-gradient(to top,#000 62%,rgba(0,0,0,0));}
.bar .btn-primary{flex:1}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);
  display:flex;align-items:flex-end;animation:fade .14s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:90vh;background:#141416;
  border-radius:14px 14px 0 0;
  display:flex;flex-direction:column;animation:up .2s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:560px){
  .scrim{align-items:center;justify-content:center;padding:20px}
  .sheet{max-width:520px;border-radius:14px;animation:fade .2s ease}
}
.grab{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:8px auto 0;flex:none}
.shead{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;
  border-bottom:1px solid var(--line);flex:none;min-height:56px}
.shead h3{flex:1;font-size:17px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .sub{font-size:14px;color:var(--muted)}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 12px 20px;display:flex;flex-direction:column;gap:18px}
/* a scrolling flex column must not squash its children: without this a long list
   is shrunk to the height of the sheet, clipped by its own overflow, and the
   receipts past the fold become unreachable. */
.sbody > *{flex:0 0 auto}
.sfoot{padding:12px 12px calc(var(--sab) + 14px);border-top:1px solid var(--line);
  display:flex;gap:10px;flex:none}
.sfoot .btn{flex:1}

/* ---------- receipt rows ---------- */
/* receipt rows read as iOS grouped-list cells: art, text, value, chevron */
.rlist{background:var(--surface);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column}
.rrow{display:flex;gap:12px;align-items:center;padding:9px 12px 9px 12px;
  text-align:left;position:relative;min-height:60px;width:100%}
.rrow + .rrow::before{content:"";position:absolute;top:0;left:74px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}
.rrow:active{background:var(--surface-2)}
.rrow::after{content:"";width:7px;height:7px;flex:none;margin-left:2px;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(-45deg)}
.thumb{width:50px;height:50px;border-radius:8px;flex:none;object-fit:cover;
  background:var(--surface-2);display:grid;place-items:center;color:var(--faint);
  font-size:10px;font-weight:700;letter-spacing:.05em;overflow:hidden}
.rmeta{flex:1;min-width:0}
.rmeta b{display:block;font-size:16px;font-weight:400;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta span{display:block;font-size:13px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ramt{font-size:16px;font-weight:400;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:none}
.empty{text-align:center;color:var(--faint);font-size:15px;padding:34px 12px}

/* ---------- preview ---------- */
.pv{width:100%;max-height:min(30vh,250px);object-fit:contain;border-radius:13px;
  background:var(--bg);border:1px solid var(--line);display:block;
  will-change:transform;transform-origin:center center;-webkit-user-drag:none}
.pvfile{display:flex;align-items:center;gap:12px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:13px;padding:15px}
.pvfile b{font-size:14.5px}
.pvfile span{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hintline{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.sumline{font-size:13px;line-height:1.45;margin:0;color:var(--muted);min-height:1px}
.sumline.bad{color:var(--warn)}
.readbox .unknown{color:var(--warn)}

/* what the reader pulled off the receipt — always shown so it can be checked */
.readbox{display:flex;gap:11px;align-items:flex-start;
  background:var(--surface);border-radius:10px;padding:12px 14px;
  border-left:3px solid var(--warn)}
.readbox.reading,.readbox.none{border-left-color:var(--surface-3)}
.readbox .rspin{width:15px;height:15px;flex:none;margin-top:2px;
  border:2px solid var(--surface-3);border-top-color:var(--muted);
  border-radius:50%;animation:sp .8s linear infinite}
.readbox .rmark{flex:none;margin-top:1px;color:var(--warn);line-height:0}
.readbox .rmark svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.readbox .rtext{flex:1;min-width:0}
.readbox b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.readbox span{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.readbox code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;background:var(--surface-2);border-radius:4px;padding:1px 5px;
  color:var(--text)}

/* ---------- viewer ---------- */
.viewer{position:fixed;inset:0;z-index:70;background:#000;
  display:flex;flex-direction:column;animation:fade .18s ease}
.viewer .vhead{display:flex;align-items:center;gap:6px;
  padding:calc(var(--sat) + 8px) 10px 8px;background:rgba(0,0,0,.72);
  position:relative;z-index:3}
.viewer .vhead .icb{color:#fff}
.viewer .vhead .icb:active{background:rgba(255,255,255,.16)}
.viewer .vreset{opacity:0;pointer-events:none;transition:opacity .15s}
.viewer.zoomed .vreset{opacity:1;pointer-events:auto}
.viewer .vhead b{flex:1;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the picture zooms, never the page: no browser gestures inside here */
.viewer .vbody{flex:1;display:grid;place-items:center;overflow:hidden;padding:10px;
  touch-action:none;-webkit-user-select:none;user-select:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;
  will-change:transform;transform-origin:center center;-webkit-user-drag:none}

/* ---------- live camera ---------- */
#cam{position:fixed;inset:0;z-index:60;background:#000;overflow:hidden}
#camvid{width:100%;height:100%;object-fit:cover;display:block}
.camframe{position:absolute;left:7%;right:7%;
  top:calc(var(--sat) + 84px);bottom:calc(var(--sab) + 132px);pointer-events:none}
.camframe i{position:absolute;width:28px;height:28px;
  border:2.5px solid rgba(255,255,255,.9);border-radius:3px}
.camframe i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:10px}
.camframe i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:10px}
.camframe i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:10px}
.camframe i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:10px}
.camtop{position:absolute;top:0;left:0;right:0;
  padding:calc(var(--sat) + 12px) 16px 16px;display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent)}
.camicb{color:#fff;background:rgba(0,0,0,.42);flex:none}
.camicb:active{background:rgba(0,0,0,.72)}
#camhint{color:rgba(255,255,255,.92);font-size:13.5px;font-weight:500;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.cambar{position:absolute;left:0;right:0;bottom:0;
  padding:20px 22px calc(var(--sab) + 24px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:linear-gradient(to top,rgba(0,0,0,.78),transparent)}
.camside{color:#fff;font-size:15px;font-weight:600;min-width:66px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:left}
.camside:active{opacity:.6}
.camdate{text-align:right;font-weight:500;opacity:.75;font-size:13px;pointer-events:none}
.shutter{width:70px;height:70px;border-radius:50%;flex:none;
  border:4px solid rgba(255,255,255,.92);display:grid;place-items:center;padding:0}
.shutter span{width:56px;height:56px;border-radius:50%;background:#fff;
  transition:transform .12s}
.shutter:active span{transform:scale(.86)}
.shutter[disabled]{opacity:.4}

/* pinch-zoom readout */
.camzoom{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(var(--sat) + 62px);z-index:2;pointer-events:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:20px;padding:5px 13px;color:#fff;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums}


/* ---------- menu drawer ---------- */
.drawer{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.6);
  animation:fade .18s ease;display:flex}
.dpanel{width:min(310px,84vw);background:var(--bg);height:100%;
  display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(var(--sat) + 20px) 14px calc(var(--sab) + 20px);gap:22px;
  animation:slidein .24s cubic-bezier(.32,.72,0,1)}
@keyframes slidein{from{transform:translateX(-100%)}}
.dhead{padding:0 4px}
.dhead b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em}
.dhead span{display:block;font-size:14px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* rows are iOS settings cells: tinted glyph tile, label, chevron */
.ditem{display:flex;align-items:center;gap:12px;padding:11px 12px;
  font-size:17px;font-weight:400;text-align:left;color:var(--text);
  width:100%;letter-spacing:-.01em;min-height:48px}
.ditem:active{background:var(--surface-2)}
.gly{width:29px;height:29px;border-radius:7px;flex:none;display:grid;place-items:center;
  background:var(--surface-3);color:#fff}
.gly svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.gly.tint{background:var(--accent-fill);color:var(--on-accent)}
.ditem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem .chev{width:7px;height:7px;flex:none;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(-45deg)}
.ditem .val{font-size:15px;color:var(--muted);flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42%}
.ditem.on .lbl{color:var(--accent);font-weight:500}
.ditem.soon{pointer-events:none}
.ditem.soon .lbl,.ditem.soon .gly{opacity:.42}
.ditem.soon em{font-style:normal;font-size:15px;color:var(--faint);flex:none}
.ditem.danger .lbl{color:var(--danger)}
.ditem.danger .gly{background:var(--danger);color:#fff}

/* ---------- storage meter ---------- */
.usedrow{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.usedtop{display:flex;align-items:baseline;gap:7px}
.usedtop b{font-size:23px;font-weight:700;letter-spacing:-.02em}
.usedtop span{font-size:14px;color:var(--muted)}
.usedbar{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.usedbar i{display:block;height:100%;background:var(--accent);border-radius:4px;
  transition:width .3s}
.usedsub{font-size:12.5px;color:var(--muted)}
.thumb.gone{font-size:9px;line-height:1.2;text-align:center;padding:3px}

/* ---------- folders ---------- */
.frow{display:flex;align-items:center;gap:12px;padding:11px 13px;width:100%;
  text-align:left;position:relative;min-height:56px}
.frow + .frow::before{content:"";position:absolute;top:0;left:55px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}
.frow:active{background:var(--surface-2)}
.fmeta{flex:1;min-width:0}
.fmeta b{display:block;font-size:16.5px;font-weight:400;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftot{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;flex:none;
  letter-spacing:-.01em}
.ftotals{display:flex;padding:13px 14px;gap:8px}
.ftotals div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ftotals div:last-child{align-items:flex-end}
.ftotals span{font-size:12px;color:var(--muted)}
.ftotals b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em}
.ftotals b.accent{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--surface-2);border-radius:16px;padding:7px 13px;
  font-size:14px;color:var(--text)}
.chip:active{background:var(--surface-3)}
.pickfolder{width:100%;background:var(--surface-2);border-radius:10px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:17px;
  color:var(--text);text-align:left}
.pickfolder .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickfolder:active{background:var(--surface-3)}
#pickhost .scrim{z-index:80}
/* a question always sits above the working overlay, never under it */
#askhost .scrim{z-index:96}

/* ---------- recently added ---------- */
.rclist{background:var(--surface);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column}
.rcrow{display:flex;align-items:center;gap:10px;padding:9px 12px;position:relative}
.rcrow + .rcrow::before{content:"";position:absolute;top:0;left:88px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}
.rcrow.on{background:var(--surface-2)}
.pick{width:24px;height:24px;border-radius:50%;flex:none;
  border:2px solid var(--faint);display:grid;place-items:center}
.pick.on{background:var(--accent-fill);border-color:var(--accent-fill)}
.pick.on::after{content:"";width:11px;height:6px;border-left:2px solid #fff;
  border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}
.rcmeta{flex:1;min-width:0;text-align:left}
.rcmeta b{display:block;font-size:15.5px;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcmeta span{display:block;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcmeta .figs{font-variant-numeric:tabular-nums;color:var(--faint);font-size:12px}
.rcamt{flex:none;padding-left:4px;text-align:right}
.rcamt b{font-size:16px;font-weight:600;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums}

/* the Select / Cancel line above a folder's list */
.listbar{display:flex;align-items:center;justify-content:space-between;
  padding:0 4px 2px;gap:10px}
.listbar span{font-size:12.5px;color:var(--muted)}
.listbar button{font-size:15px;color:var(--accent);font-weight:500;padding:4px 2px}
.recentfoot{align-items:center}
.recentfoot .hintline{margin:0}

/* ---------- report builder ---------- */
.selsum{position:sticky;top:0;z-index:2;margin-bottom:2px}
.selbody{display:flex;flex-direction:column;gap:18px}
.selrow{display:flex;align-items:center;gap:11px;padding:11px 13px;width:100%;
  text-align:left;position:relative;min-height:52px}
.selrow + .selrow::before{content:"";position:absolute;top:0;left:48px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}
.selrow.on{background:var(--surface-2)}
.selrow .chev{width:7px;height:7px;flex:none;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(-45deg)}
.selmeta{flex:1;min-width:0}
.selmeta b{display:block;font-size:15.5px;font-weight:400;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selmeta span{display:block;font-size:12.5px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bcell{position:relative;aspect-ratio:3/4;border-radius:9px;overflow:hidden;
  background:var(--surface-2)}
.bcell img{width:100%;height:100%;object-fit:cover;display:block}
.bcell span{position:absolute;top:5px;left:5px;min-width:19px;height:19px;
  border-radius:10px;background:var(--accent-fill);color:var(--on-accent);
  font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------- year view ---------- */
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ycell{background:var(--surface);border-radius:10px;
  padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ycell:active{background:var(--surface-2)}
.ycell.on{box-shadow:inset 0 0 0 2px var(--accent)}
.ycell .amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--accent);letter-spacing:-.02em}
.ycell .amt.zero{color:var(--faint);font-weight:400}
.ycell .mon{font-size:13px;font-weight:400;color:var(--text)}
.ycell .cnt{font-size:11px;color:var(--muted)}
/* ---------- planning ---------- */
/* Same cards, calendar, spacing and buttons as the rest of the app — the only
   new pieces are the status chip, the run bars on the calendar and the
   progress bar, and those are built from the existing colour tokens. */
.pgroup{margin-top:26px}
.pgroup h4{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px 3px;display:flex;gap:7px;align-items:center}
.pgroup h4 i{font-style:normal;font-size:11px;font-weight:700;color:var(--faint)}

.prow{display:flex;align-items:center;gap:12px;padding:12px 13px;width:100%;
  text-align:left;position:relative;min-height:62px}
.prow + .prow::before{content:"";position:absolute;top:0;left:13px;right:0;
  height:1px;background:var(--line);transform:scaleY(.5)}
.prow:active{background:var(--surface-2)}
.pmeta{flex:1;min-width:0}
.pmeta .proj{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta b{display:block;font-size:16.5px;font-weight:500;letter-spacing:-.01em;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* status chip — one token per status, used everywhere a status is shown */
.pchip{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;white-space:nowrap;
  background:var(--surface-3);color:var(--muted)}
.pchip.s-in_progress{background:rgba(10,132,255,.18);color:#5aa9ff}
.pchip.s-completed{background:rgba(48,209,88,.16);color:#4cd964}
.pchip.s-delayed{background:rgba(255,159,10,.18);color:#ffa62b}
.pchip.s-overdue{background:rgba(255,69,58,.18);color:#ff6961}

/* progress */
.pbarwrap{width:78px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pbarwrap i{display:block;height:100%;background:var(--accent);border-radius:3px}
.ppct{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.prange{flex:1;padding:0;height:28px;background:none;border-radius:0;
  -webkit-appearance:none;appearance:none}
.prange:focus{box-shadow:none}
.prange::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:var(--surface-3)}
.prange::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;
  background:#fff;margin-top:-9.5px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.prange::-moz-range-track{height:5px;border-radius:3px;background:var(--surface-3)}
.prange::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff}
.prangerow{display:flex;align-items:center;gap:12px}
.prangerow b{width:44px;text-align:right;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums}

/* a plan's run across the calendar: one thin bar per day it covers */
.cell.plan{justify-content:flex-start;padding-top:9px;gap:3px}
.runs{display:flex;flex-direction:column;gap:2px;width:100%;padding:0 4px;margin-top:auto;
  margin-bottom:5px}
.run{height:4px;border-radius:2px;background:var(--surface-3)}
.run.s-not_started{background:var(--faint)}
.run.s-in_progress{background:var(--accent)}
.run.s-completed{background:#30d158}
.run.s-delayed{background:#ff9f0a}
.run.mid{border-radius:0}
.run.start{border-radius:2px 0 0 2px}
.run.end{border-radius:0 2px 2px 0}
.runmore{font-size:9px;font-weight:700;color:var(--faint);line-height:1;text-align:center}

/* ---------- the programme ----------
   A construction programme read the way a diary is read: the dates run down the
   page and you scroll down into the future. Each job's activities sit in their
   own columns beside the dates, and a job lasting several days is one bar
   running down through those days. Only the columns scroll sideways — the page
   itself never does. */
.pseg{display:flex;gap:2px;background:var(--surface-2);border-radius:10px;padding:2px;
  margin-bottom:12px}
.pseg button{flex:1;padding:8px 10px;border-radius:8px;font-size:14.5px;font-weight:500;
  color:var(--muted)}
.pseg button.on{background:var(--surface-3);color:var(--text);font-weight:600}

#programme{max-width:100%;overflow:hidden}
.tlkey{display:flex;flex-wrap:wrap;gap:12px;padding:0 3px 9px;font-size:12px;color:var(--muted)}
.tlkey span{display:flex;align-items:center;gap:6px}
.tlkey i{width:9px;height:9px;border-radius:3px;display:block}

.tlgrid{display:flex;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.tldates{width:56px;flex:none;position:relative;background:var(--surface-2)}
/* only this part moves sideways, and it cannot scroll vertically, so the page
   keeps its own natural up-and-down scrolling */
.tlpan{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tllanes{position:relative}

.tlday{position:absolute;left:0;right:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  border-bottom:1px solid var(--line)}
.tlday b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.tlday span{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);line-height:1}
.tlday.we{background:rgba(255,255,255,.03)}
.tlday.we b{color:var(--muted)}
.tlday.mstart{border-top:1px solid var(--faint)}
.tlday.mstart em{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent);line-height:1}
.tlday.today{background:var(--accent-fill)}
.tlday.today b,.tlday.today span,.tlday.today em{color:var(--on-accent)}

.tlline{position:absolute;left:0;right:0;height:1px;background:var(--line);
  transform:scaleY(.5)}
.tlline.we{height:auto;background:rgba(255,255,255,.03);transform:none}
.tlline.now{height:2px;background:var(--accent);opacity:.8;transform:none;z-index:2}

.tljobs{display:flex;padding:0 0 2px}
.tljob{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 8px 6px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tlbar{position:absolute;border-radius:8px;padding:6px 8px;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;text-align:left}
.tlbar b{font-size:13px;font-weight:600;line-height:1.2;color:#fff;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tlbar span{font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:rgba(255,255,255,.72);line-height:1}
.tlbar.j0{background:#0f6d64}
.tlbar.j1{background:#2f5ea8}
.tlbar.j2{background:#6b4a9e}
.tlbar.j3{background:#8a5a2b}
.tlbar.done{opacity:.5}
.tlbar.late{box-shadow:inset 0 0 0 2px #ff6961}
.tlbar:active{filter:brightness(1.25)}
.gempty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14.5px}

/* ---------- site records ----------
   Evidence of what was done before it was covered up. Same cards, chips and
   sheets as everywhere else; the only new piece is the photo grid. */
.srhead{padding:0 3px 10px;font-size:13px;color:var(--muted);line-height:1.45}
.srjob{margin-bottom:20px}
.srjob h4{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px 3px}
.srrow{display:flex;align-items:center;gap:12px;padding:11px 12px;width:100%;
  text-align:left;position:relative;min-height:66px}
.srrow + .srrow::before{content:"";position:absolute;top:0;left:74px;right:0;height:1px;
  background:var(--line);transform:scaleY(.5)}
.srrow:active{background:var(--surface-2)}
.srthumb{width:52px;height:52px;border-radius:9px;flex:none;object-fit:cover;
  background:var(--surface-2);display:grid;place-items:center;color:var(--faint);
  font-size:10px;font-weight:700}
.srmeta{flex:1;min-width:0}
.srmeta b{display:block;font-size:16px;font-weight:500;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srmeta span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcount{flex:none;font-size:12px;font-weight:700;color:var(--muted);
  background:var(--surface-2);border-radius:20px;padding:3px 9px}

/* the photos on a record, and while adding one */
.srgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.srcell{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;
  background:var(--surface-2)}
.srcell img{width:100%;height:100%;object-fit:cover;display:block}
.srcell .drop{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:13px;
  background:rgba(0,0,0,.66);color:#fff;display:grid;place-items:center;font-size:15px;
  line-height:1}
.srfacts{display:flex;flex-direction:column;gap:9px}
.srfact{display:flex;gap:10px;font-size:14.5px}
.srfact b{width:82px;flex:none;color:var(--muted);font-weight:400;font-size:13.5px}
.srfact span{flex:1;min-width:0}
.srnotes{font-size:15px;line-height:1.5;white-space:pre-wrap}

/* the full-screen photo viewer, with its swipe controls */
.svnav{position:absolute;bottom:calc(var(--sab) + 18px);left:0;right:0;z-index:4;
  display:flex;align-items:center;justify-content:center;gap:14px}
.svnav .icb{background:rgba(0,0,0,.6);color:#fff;width:44px;height:44px}
.svnav b{font-size:14px;font-weight:600;color:#fff;background:rgba(0,0,0,.6);
  padding:8px 14px;border-radius:20px;font-variant-numeric:tabular-nums}

/* the status picker on the form */
.statuses{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.statuses button{padding:11px 8px;border-radius:10px;background:var(--surface-2);
  font-size:14.5px;font-weight:500;color:var(--muted)}
.statuses button.on{background:var(--surface-3);color:var(--text);font-weight:600;
  box-shadow:inset 0 0 0 1.5px var(--accent)}

.pnote{min-height:76px;resize:none}
.pickproject{display:flex;align-items:center;gap:8px;width:100%;
  background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:17px}
.pickproject .lbl{flex:1;min-width:0;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickproject .chev{width:7px;height:7px;flex:none;
  border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(-45deg)}

.ynav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px}
.ynav b{font-size:17px;font-weight:700;min-width:62px;text-align:center;
  font-variant-numeric:tabular-nums}

/* the preview zooms the picture only — never the page, never the sheet.
   pan-y keeps ordinary one-finger scrolling of the form; once zoomed the
   picture takes the gesture so a drag pans the receipt instead. */
.pvwrap{position:relative;overflow:hidden;border-radius:13px;
  touch-action:pan-y;-webkit-user-select:none;user-select:none}
.pvwrap.zoomed{touch-action:none}
.pvwrap .vreset{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.62);
  color:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
.pvwrap.zoomed .vreset{opacity:1;pointer-events:auto}

/* ---------- toast + progress ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--sab) + 96px);z-index:90;background:rgba(58,58,60,.96);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;padding:11px 18px;
  font-size:14.5px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.6);
  max-width:calc(100vw - 40px);text-align:center;animation:fade .18s ease}
#toast.err{color:#ff6961}
#busy{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.86);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#busy p{font-size:15px;color:var(--muted);text-align:center;padding:0 30px}
.spin{width:32px;height:32px;border:3px solid var(--line);
  border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.track{width:min(240px,60vw);height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
</style>
</head>

<script>
/* ============================================================
   Receipts — shared receipt tracker
   ============================================================ */
const SUPABASE_URL = 'https://mxncjgxpgsilepojwttb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_N53SPrcpCaC8B7HtH30Njg_120kFg5g';
const BUCKET   = 'receipts';
const CURRENCY = '£';

let db;   // supabase client, created once the library lands

/* onerror only fires on a definite failure. A request that simply stalls — a
   weak signal, a captive portal, slow DNS — never fires anything, so without a
   deadline this promise stays pending and the app never paints: a black screen
   with no spinner and no message. The deadline turns that into a real failure
   we can fall through to the next mirror, and then to the error screen. */
function loadScript(src, ms) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    let settled = false;
    const finish = (fn, arg) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      fn(arg);
    };
    const timer = setTimeout(() => {
      s.remove();
      finish(rej, new Error('timed out: ' + src));
    }, ms || 12000);
    s.src = src;
    s.onload  = () => finish(res);
    s.onerror = () => finish(rej, new Error('failed: ' + src));
    document.head.appendChild(s);
  });
}

async function loadSupabase() {
  if (window.supabase?.createClient) return;
  const sources = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  for (const src of sources) {
    try {
      await loadScript(src);
      if (window.supabase?.createClient) return;
    } catch { /* try the next mirror */ }
  }
  throw new Error('offline');
}

/* ---------- tiny helpers ---------- */
const $  = s => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && n.appendChild(c));
  return n;
};
const pad2  = n => String(n).padStart(2, '0');
const ymd   = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const money = n => CURRENCY + (Number(n) || 0).toFixed(2);
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function prettyDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'long' });
}

let toastTimer;
function toast(msg, isErr) {
  clearTimeout(toastTimer);
  $('#toast')?.remove();
  document.body.appendChild(el('div', { id:'toast', class: isErr ? 'err' : '', text: msg }));
  toastTimer = setTimeout(() => $('#toast')?.remove(), isErr ? 4200 : 2400);
}
function busy(on, text, pct) {
  const b = $('#busy');
  b.classList.toggle('hide', !on);
  if (text) $('#busytxt').textContent = text;
  const track = $('#track');
  if (pct === undefined) track.classList.add('hide');
  else { track.classList.remove('hide'); $('#bar').style.width = Math.round(pct * 100) + '%'; }
}
function niceError(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || 'Something went wrong');
  if (/invalid login credentials/i.test(m)) return 'That email and password combination did not match an account.';
  if (/email not confirmed/i.test(m))       return 'This account still needs to be confirmed by email before it can sign in.';
  if (/user already registered/i.test(m))   return 'There is already an account with that email — try signing in instead.';
  if (/signups? not allowed|disabled/i.test(m))
    return 'Accounts here are created by the owner, not signed up for. ' +
           'Put in the email and password you were given and tap Sign in.';
  if (/rate limit|too many/i.test(m))       return 'Too many attempts just now. Wait a minute and try again.';
  if (/failed to fetch|network/i.test(m))   return 'No connection. Check your signal and try again.';
  return m;
}

/* ---------- state ---------- */
let session = null;
let view    = new Date();              // any date inside the visible month
let rows    = [];                      // receipts for the visible month
let thumbs  = new Map();               // file_path -> signed url
let pending = null;                    // { blob, type, ext, previewUrl, dateStr }

/* ============================================================
   AUTH
   ============================================================ */
let mode = 'in';                       // 'in' | 'up'

function authMsg(text, kind) {
  const box = $('#authmsg');
  if (!text) { box.classList.add('hide'); box.textContent = ''; return; }
  box.className = 'msg ' + (kind === 'ok' ? 'msg-ok' : 'msg-err');
  box.textContent = text;
}
function setMode(next) {
  mode = next;
  const up = mode === 'up';
  $('#authbtn').textContent = up ? 'Create account' : 'Sign in';
  $('#swaptxt').textContent = up ? 'Already have an account?' : 'No account yet?';
  $('#swapbtn').textContent = up ? 'Sign in' : 'Create one';
  $('#pw').autocomplete    = up ? 'new-password' : 'current-password';
  $('#authblurb').textContent = up
    ? 'Everyone who signs in shares the same receipt book.'
    : 'Snap it, file it, forget it.';
  // NB: never clears authMsg — the submit handler calls this in `finally`
  // to restore the button label, and that must not wipe the error just shown.
}
$('#swapbtn').onclick = () => { authMsg(''); setMode(mode === 'in' ? 'up' : 'in'); };

$('#authform').onsubmit = async ev => {
  ev.preventDefault();
  const email = $('#em').value.trim();
  const password = $('#pw').value;
  const btn = $('#authbtn');
  btn.disabled = true;
  btn.textContent = mode === 'up' ? 'Creating…' : 'Signing in…';
  authMsg('');
  try {
    if (mode === 'up') {
      const { data, error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      if (!data.session) {
        authMsg('Account created. Check your email for the confirmation link, then sign in.', 'ok');
        setMode('in');
        return;
      }
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
    }
  } catch (e) {
    const blocked = /signups? not allowed|disabled/i.test(e && e.message || '');
    if (blocked) setMode('in');            // put them on the right button
    authMsg(niceError(e), blocked ? 'ok' : 'err');
  } finally {
    btn.disabled = false;
    setMode(mode);
  }
};

/* ============================================================
   CALENDAR
   ============================================================ */
function monthRange(d) {
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const last  = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return [ymd(first), ymd(last)];
}

async function loadMonth() {
  const [from, to] = monthRange(view);
  $('#mlabel').textContent = `${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
  renderGrid();                                   // paint the empty shell immediately
  try {
    const { data, error } = await db
      .from('receipts')
      .select('*')
      .gte('receipt_date', from)
      .lte('receipt_date', to)
      .order('receipt_date', { ascending: true })
      .order('created_at',   { ascending: true });
    if (error) throw error;
    rows = data || [];
  } catch (e) {
    rows = [];
    toast(niceError(e), true);
  }
  renderGrid();
  renderTotals();
  renderRecent();
  signThumbs();
}

/* Thumbnails load only as they scroll into view, so a folder holding hundreds of
   receipts signs and fetches a handful of images rather than all of them. */
let thumbObserver = null;
const pendingThumbs = new Set();
let thumbTimer = null;

function ensureThumbObserver() {
  if (thumbObserver || !('IntersectionObserver' in window)) return thumbObserver;
  thumbObserver = new IntersectionObserver(entries => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const img = e.target, path = img.dataset.path;
      thumbObserver.unobserve(img);
      if (!path) continue;
      const cached = thumbs.get(path);
      if (cached) { img.src = cached; continue; }
      pendingThumbs.add(path);
      clearTimeout(thumbTimer);
      thumbTimer = setTimeout(flushThumbs, 60);   // group a scroll burst into one request
    }
  }, { root: null, rootMargin: '300px 0px', threshold: 0.01 });
  return thumbObserver;
}

async function flushThumbs() {
  const paths = [...pendingThumbs].filter(p => !thumbs.has(p)).slice(0, 100);
  pendingThumbs.clear();
  if (!paths.length) return;
  try {
    const { data, error } = await db.storage.from(BUCKET).createSignedUrls(paths, 3600);
    if (error) throw error;
    (data || []).forEach(o => { if (o.signedUrl) thumbs.set(o.path, o.signedUrl); });
    paintThumbs();
  } catch { /* thumbnails are cosmetic — never block on them */ }
}

function paintThumbs() {
  document.querySelectorAll('img[data-path]').forEach(img => {
    const u = thumbs.get(img.dataset.path);
    if (u && img.src !== u) img.src = u;
  });
}

function signThumbs() {
  const obs = ensureThumbObserver();
  const imgs = document.querySelectorAll('img[data-path]');
  if (!obs) {                                   // no observer support: fetch them all
    imgs.forEach(i => i.dataset.path && pendingThumbs.add(i.dataset.path));
    flushThumbs();
    return;
  }
  imgs.forEach(img => {
    const cached = thumbs.get(img.dataset.path);
    if (cached) { if (img.src !== cached) img.src = cached; return; }
    obs.observe(img);
  });
}

function byDay() {
  const m = new Map();
  rows.forEach(r => {
    if (!m.has(r.receipt_date)) m.set(r.receipt_date, []);
    m.get(r.receipt_date).push(r);
  });
  return m;
}

function renderTotals() {
  // summed from the stored records, never from rates
  const s = sumRows(rows);
  // net stays in the records for the figures that need it; it is not shown here
  $('#tcount').textContent = s.n;
  $('#tvat').textContent   = money(s.vat);
  $('#ttotal').textContent = money(s.total);
}

function renderRecent() {
  const box = $('#recent'), list = $('#recentlist');
  // the header is the way into the full list, so this section is always here,
  // even in a month with nothing in it yet
  box.classList.remove('hide');
  $('#recenthead').onclick = openRecent;
  const latest = [...rows]
    .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))
    .slice(0, 4);
  list.innerHTML = '';
  if (latest.length) latest.forEach(r => list.appendChild(receiptRow(r, true)));
  else list.appendChild(el('p', { class: 'empty',
    text: 'Nothing added this month yet — tap to see everything.' }));
}

function renderGrid() {
  const grid = $('#grid');
  grid.innerHTML = '';
  const y = view.getFullYear(), m = view.getMonth();
  const first = new Date(y, m, 1);
  const lead  = (first.getDay() + 6) % 7;           // Monday-first
  const days  = new Date(y, m + 1, 0).getDate();
  const map   = byDay();
  const today = ymd(new Date());

  for (let i = 0; i < lead; i++) grid.appendChild(el('div', { class: 'cell blank' }));

  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const list = map.get(ds) || [];
    const cell = el('button', {
      class: 'cell' + (list.length ? ' has' : '') + (ds === today ? ' today' : ''),
      onclick: () => openDay(ds)
    });
    cell.appendChild(el('span', { class: 'n', text: String(d) }));
    const pips = el('div', { class: 'pips' });
    if (list.length <= 3) {
      for (let i = 0; i < list.length; i++) pips.appendChild(el('span', { class: 'pip' }));
    } else {
      pips.appendChild(el('span', { class: 'pip' }));
      pips.appendChild(el('span', { class: 'pip more', text: String(list.length) }));
    }
    cell.appendChild(pips);
    grid.appendChild(cell);
  }
}

$('#prev').onclick  = () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); loadMonth(); };
$('#next').onclick  = () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); loadMonth(); };
$('#today').onclick = () => { view = new Date(); loadMonth(); };

/* ============================================================
   YEAR VIEW — every month with its total
   ============================================================ */
async function openYear(year) {
  busy(true, 'Adding up ' + year + '…');
  let data;
  try {
    const res = await db.from('receipts').select('receipt_date,amount,vat,net')
      .gte('receipt_date', `${year}-01-01`).lte('receipt_date', `${year}-12-31`);
    if (res.error) throw res.error;
    data = res.data || [];
  } catch (e) {
    busy(false); toast(niceError(e), true); return;
  }
  busy(false);

  const tot = Array.from({ length: 12 }, () => ({ n: 0, sum: 0, vat: 0 }));
  data.forEach(r => {
    const m = Number(r.receipt_date.slice(5, 7)) - 1;
    if (tot[m]) {
      tot[m].n++;
      tot[m].sum += Number(r.amount) || 0;
      tot[m].vat += Number(r.vat) || 0;
    }
  });
  const yearTotal = tot.reduce((s, t) => s + t.sum, 0);
  const yearVat   = tot.reduce((s, t) => s + t.vat, 0);
  const yearCount = tot.reduce((s, t) => s + t.n, 0);
  const now = new Date();

  const grid = el('div', { class: 'ygrid' }, tot.map((t, m) => {
    const isNow = m === view.getMonth() && year === view.getFullYear();
    return el('button', {
      class: 'ycell' + (isNow ? ' on' : ''),
      onclick: () => { view = new Date(year, m, 1); closeSheet(); loadMonth(); }
    }, [
      el('span', { class: 'amt' + (t.sum ? '' : ' zero'), text: t.sum ? money(t.sum) : '—' }),
      el('span', { class: 'mon', text: MONTHS[m].slice(0, 3) }),
      el('span', { class: 'cnt', text: t.vat ? 'VAT ' + money(t.vat)
                                    : t.n ? t.n + (t.n === 1 ? ' receipt' : ' receipts') : 'nothing' })
    ]);
  }));

  const nav = el('div', { class: 'ynav' }, [
    el('button', { class: 'icb', 'aria-label': 'Previous year', onclick: () => openYear(year - 1),
      html: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' }),
    el('b', { text: String(year) }),
    el('button', { class: 'icb', 'aria-label': 'Next year',
      onclick: () => { if (year < now.getFullYear() + 1) openYear(year + 1); },
      html: '<svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>' })
  ]);

  sheet({
    title: String(year),
    sub: yearCount ? `${money(yearTotal)} · VAT ${money(yearVat)}` : 'nothing filed',
    body: [nav, grid]
  });
}

/* ============================================================
   STORAGE
   Pictures are the only thing here with real weight, so a month's images can be
   cleared while every row, price, VAT figure and date stays exactly where it is.
   ============================================================ */
const QUOTA_BYTES = 1024 * 1024 * 1024;      // Supabase free plan allowance

const sizeOf = b => {
  const n = Number(b) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
};

async function openStorage() {
  busy(true, 'Adding up what is stored…');
  let data;
  try {
    const res = await db.from('receipts')
      .select('receipt_date,file_size,image_cleared,file_type')
      .order('receipt_date', { ascending: false });
    if (res.error) throw res.error;
    data = res.data || [];
  } catch (e) { busy(false); toast(niceError(e), true); return; }
  busy(false);

  const months = new Map();
  let used = 0;
  data.forEach(r => {
    const key = r.receipt_date.slice(0, 7);
    if (!months.has(key)) months.set(key, { n: 0, bytes: 0, cleared: 0 });
    const m = months.get(key);
    m.n++;
    if (r.image_cleared) m.cleared++;
    else { m.bytes += Number(r.file_size) || 0; used += Number(r.file_size) || 0; }
  });

  const pct = Math.min(100, (used / QUOTA_BYTES) * 100);
  const head = el('div', { class: 'grp' }, [
    el('div', { class: 'card' }, [
      el('div', { class: 'usedrow' }, [
        el('div', { class: 'usedtop' }, [
          el('b', { text: sizeOf(used) }),
          el('span', { text: 'of ' + sizeOf(QUOTA_BYTES) })
        ]),
        el('div', { class: 'usedbar' }, [
          el('i', { style: 'width:' + Math.max(pct, used ? 1.5 : 0) + '%' })
        ]),
        el('span', { class: 'usedsub', text: pct < 0.1 && used
          ? 'Under a tenth of a percent — nothing to worry about yet.'
          : pct.toFixed(1) + '% used · Supabase free plan' })
      ])
    ])
  ]);

  const rowsUi = [...months.entries()].map(([key, m]) => {
    const [yy, mm] = key.split('-');
    const label = `${MONTHS[+mm - 1]} ${yy}`;
    const canClear = m.bytes > 0;
    return el('button', {
      class: 'ditem' + (canClear ? '' : ' soon'),
      onclick: canClear ? () => clearMonthImages(key, label, m) : null
    }, [
      el('span', { class: 'gly', html:
        '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/>' +
        '<path d="M8 2v4M16 2v4M3 10h18"/></svg>' }),
      el('span', { class: 'lbl', text: label }),
      el('span', { class: 'val', text: canClear
        ? `${m.n} · ${sizeOf(m.bytes)}`
        : `${m.n} · cleared` }),
      canClear ? el('span', { class: 'chev' }) : null
    ]);
  });

  sheet({
    title: 'Storage',
    sub: data.length ? `${data.length} receipts` : '',
    body: [
      head,
      months.size
        ? el('div', { class: 'grp' }, [
            el('h4', { text: 'By month — tap to clear its pictures' }),
            el('div', { class: 'card' }, rowsUi)
          ])
        : el('p', { class: 'empty', text: 'Nothing stored yet.' }),
      el('p', { class: 'hintline', text:
        'Clearing a month deletes only the pictures. Every receipt keeps its date, ' +
        'description, total and VAT, so your figures and the year view do not change — ' +
        'but that month can no longer be exported with images in it.' })
    ]
  });
}

async function clearMonthImages(key, label, m) {
  const ok = await ask('Clear ' + label + '?',
    `This deletes ${m.n - m.cleared} picture${m.n - m.cleared === 1 ? '' : 's'} and frees ` +
    `${sizeOf(m.bytes)}. The receipts themselves stay — dates, totals and VAT are untouched. ` +
    `The pictures cannot be recovered.`, 'Clear pictures');
  if (!ok) return;

  busy(true, 'Clearing ' + label + '…');
  try {
    const last = new Date(+key.slice(0, 4), +key.slice(5, 7), 0).getDate();
    const res = await db.from('receipts')
      .select('id,file_path')
      .gte('receipt_date', key + '-01')
      .lte('receipt_date', `${key}-${pad2(last)}`)
      .eq('image_cleared', false);
    if (res.error) throw res.error;
    const list = res.data || [];
    if (!list.length) { busy(false); toast('Nothing left to clear'); return; }

    // flag the rows first — a half-done delete then shows as cleared rather than broken
    const upd = await db.from('receipts')
      .update({ image_cleared: true, file_size: 0 })
      .in('id', list.map(r => r.id));
    if (upd.error) throw upd.error;

    for (let i = 0; i < list.length; i += 50) {
      await db.storage.from(BUCKET).remove(list.slice(i, i + 50).map(r => r.file_path));
    }
    list.forEach(r => thumbs.delete(r.file_path));

    busy(false);
    closeSheet();
    await loadMonth();
    toast(`Cleared ${label} — freed ${sizeOf(m.bytes)}`);
  } catch (e) {
    busy(false);
    toast(niceError(e), true);
  }
}

/* ============================================================
   FOLDERS
   A folder is just a label a receipt points at, so moving one between folders
   never touches its figures. Totals are always summed from the receipt records
   themselves — never from rates or percentages.
   ============================================================ */
let folders = [];

const SUGGESTED_FOLDERS =
  ['Client Meals', 'Fuel', 'Materials', 'Tools', 'Office', 'Travel'];

async function loadFolders(force) {
  if (folders.length && !force) return folders;
  const { data, error } = await db.from('folders').select('*').order('name');
  if (error) { toast(niceError(error), true); return folders; }
  folders = data || [];
  return folders;
}

const folderById = id => folders.find(f => f.id === id) || null;
const folderName = id => { const f = folderById(id); return f ? f.name : null; };

function sumRows(list) {
  return list.reduce((a, r) => ({
    n: a.n + 1,
    net:   a.net   + (Number(r.net)    || 0),
    vat:   a.vat   + (Number(r.vat)    || 0),
    total: a.total + (Number(r.amount) || 0)
  }), { n: 0, net: 0, vat: 0, total: 0 });
}

async function createFolder(name, key) {
  const clean = String(name || '').trim().slice(0, 60);
  if (!clean) return null;
  const dup = folders.find(f => f.name.toLowerCase() === clean.toLowerCase());
  if (dup) { toast('“' + dup.name + '” already exists'); return dup; }
  const { data, error } = await db.from('folders')
    .insert({ name: clean }).select();
  if (error) { toast(niceError(error), true); return null; }
  await loadFolders(true);
  return (data && data[0]) || null;
}

/* Offered, never done automatically — an unwanted folder is worse than none. */
async function openFolders() {
  busy(true, 'Loading folders…');
  await loadFolders(true);
  let rowsAll;
  try {
    const res = await db.from('receipts').select('folder_id,amount,vat,net');
    if (res.error) throw res.error;
    rowsAll = res.data || [];
  } catch (e) { busy(false); toast(niceError(e), true); return; }
  busy(false);

  const byFolder = new Map();
  rowsAll.forEach(r => {
    const k = r.folder_id || '__none';
    if (!byFolder.has(k)) byFolder.set(k, []);
    byFolder.get(k).push(r);
  });

  const card = (f) => {
    const s = sumRows(byFolder.get(f ? f.id : '__none') || []);
    return el('button', {
      class: 'frow',
      onclick: () => openFolder(f)
    }, [
      el('span', { class: 'gly' + (f ? ' tint' : ''), html:
        '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>' }),
      el('div', { class: 'fmeta' }, [
        el('b', { text: f ? f.name : 'Unfiled' }),
        el('span', { text: s.n
          ? `${s.n} · net ${money(s.net)} · VAT ${money(s.vat)}`
          : 'empty' })
      ]),
      el('span', { class: 'ftot', text: s.n ? money(s.total) : '—' }),
      el('span', { class: 'chev' })
    ]);
  };

  const unfiled = (byFolder.get('__none') || []).length;
  sheet({
    title: 'Folders',
    sub: folders.length + (folders.length === 1 ? ' folder' : ' folders'),
    body: [
      el('div', { class: 'card' },
        folders.map(f => card(f)).concat(unfiled ? [card(null)] : [])),
      folders.length ? null : el('p', { class: 'empty',
        text: 'No folders yet. Add one below to start grouping receipts.' })
    ],
    foot: [ el('button', { class: 'btn btn-primary btn-full', text: 'Add Folder',
                           onclick: openAddFolder }) ]
  });
}

function openAddFolder() {
  const input = el('input', { type: 'text', id: 'f_folder', maxlength: '60',
                              placeholder: 'e.g. Client Meals' });
  const missing = SUGGESTED_FOLDERS.filter(
    s => !folders.some(f => f.name.toLowerCase() === s.toLowerCase()));

  const chips = missing.length ? el('div', { class: 'chips' }, missing.map(s =>
    el('button', { class: 'chip', text: s, onclick: () => { input.value = s; input.focus(); } })
  )) : null;

  const save = el('button', { class: 'btn btn-primary', text: 'Create' });
  save.onclick = async () => {
    const name = input.value.trim();
    if (!name) { input.focus(); toast('Give the folder a name', true); return; }
    save.disabled = true;
    busy(true, 'Creating…');
    const f = await createFolder(name);
    busy(false); save.disabled = false;
    if (f) { closeSheet(); openFolders(); }
  };

  sheet({
    title: 'Add Folder',
    body: [
      el('div', {}, [el('label', { for: 'f_folder', text: 'Folder name' }), input]),
      missing.length ? el('p', { class: 'hintline', text: 'Or start from one of these:' }) : null,
      chips
    ],
    foot: [ el('button', { class: 'btn btn-ghost', text: 'Cancel', onclick: closeSheet }), save ]
  });
  setTimeout(() => input.focus(), 250);
}

async function openFolder(f) {
  busy(true, 'Loading…');
  let list;
  try {
    const q = db.from('receipts').select('*').order('receipt_date', { ascending: false });
    const res = await (f ? q.eq('folder_id', f.id) : q.is('folder_id', null));
    if (res.error) throw res.error;
    list = res.data || [];
  } catch (e) { busy(false); toast(niceError(e), true); return; }
  busy(false);

  const s = sumRows(list);
  const picked = new Set();
  let selecting = false;
  const body = el('div', { class: 'sbody' });     // filled by paint(), see below
  let foot;

  /* Selecting reuses the same rows and the same move as Recently Added, so a
     move here is the same single folder_id update — nothing else on the receipt
     is touched, and nothing is copied or removed. */
  const paint = () => {
    body.innerHTML = '';
    body.appendChild(el('div', { class: 'card' }, [el('div', { class: 'ftotals' }, [
      el('div', {}, [el('span', { text: 'Receipts' }), el('b', { text: String(s.n) })]),
      el('div', {}, [el('span', { text: 'VAT' }),      el('b', { text: money(s.vat) })]),
      el('div', {}, [el('span', { text: 'Total' }),
                     el('b', { class: 'accent', text: money(s.total) })])
    ])]));

    body.appendChild(el('button', {
      class: 'btn btn-primary btn-full', text: '+  Add Receipt',
      onclick: () => { closeSheet(); startCapture('cam', ymd(new Date()), f ? f.id : null); }
    }));

    if (list.length) {
      body.appendChild(el('div', { class: 'listbar' }, [
        el('span', { text: selecting
          ? (picked.size ? `${picked.size} selected` : 'Tap the circles to select')
          : `${list.length} receipt${list.length === 1 ? '' : 's'}` }),
        el('button', { text: selecting ? 'Cancel' : 'Select',
          onclick: () => { selecting = !selecting; picked.clear(); paint(); } })
      ]));
      body.appendChild(selecting
        ? el('div', { class: 'rclist' }, list.map(r => pickRow(r, picked, paint, { hideFolder: true })))
        : el('div', { class: 'rlist' }, list.map(r => receiptRow(r, true))));
    } else {
      body.appendChild(el('p', { class: 'empty', text: 'Nothing filed here yet.' }));
    }

    foot.innerHTML = '';
    if (selecting) {
      const move = el('button', { class: 'btn btn-primary',
        text: picked.size ? `Move ${picked.size} to folder` : 'Move to folder',
        onclick: () => moveToFolder([...picked], () => openFolder(f)) });
      move.disabled = !picked.size;
      foot.appendChild(el('button', { class: 'btn btn-ghost', text: 'Done',
        onclick: () => { selecting = false; picked.clear(); paint(); } }));
      foot.appendChild(move);
    } else {
      foot.appendChild(el('button', { class: 'btn btn-ghost', text: 'Back',
        onclick: () => { closeSheet(); openFolders(); } }));
      if (f) foot.appendChild(el('button', { class: 'btn btn-danger', text: 'Delete folder',
        onclick: () => deleteFolder(f, s.n) }));
    }
    signThumbs();
  };

  const card = sheet({
    title: f ? f.name : 'Unfiled',
    sub: s.n ? `${s.n} · ${money(s.total)}` : 'empty',
    body: []
  });
  // swap in the live body, then hang the footer off the sheet
  card.querySelector('.sbody').replaceWith(body);
  foot = el('div', { class: 'sfoot' });
  card.appendChild(foot);
  paint();
}

async function deleteFolder(f, count) {
  const ok = await ask('Delete “' + f.name + '”?',
    count ? `The ${count} receipt${count === 1 ? '' : 's'} in it are kept — they move back to Unfiled.`
          : 'The folder is empty, so nothing else changes.',
    'Delete folder');
  if (!ok) return;
  busy(true, 'Deleting…');
  try {
    const a = await db.from('receipts').update({ folder_id: null }).eq('folder_id', f.id);
    if (a.error) throw a.error;
    const b = await db.from('folders').delete().eq('id', f.id);
    if (b.error) throw b.error;
    await loadFolders(true);
    busy(false); closeSheet(); openFolders();
    toast('Folder deleted, receipts kept');
  } catch (e) { busy(false); toast(niceError(e), true); }
}

/* One selectable receipt row, shared by Recently Added and the folder views so

function pickRow(r, picked, rebuild, opts) {

  const box = el('button', { class: 'pick' + (on ? ' on' : ''), 'aria-label': 'Select',
    onclick: e => { e.stopPropagation();

    : isPdf ? el('div', { class: 'thumb', text: 'PDF' })

/* ============================================================
   PLANNING
   Its own page, its own two tables. Built from the same pieces as the rest of
   the app — the calendar grid, cards, sheets, chips and buttons are all the
   existing ones. Nothing in here reads or writes a receipt.
   ============================================================ */
let projects  = [];                    // PROJECT rows (Oakwood Flats, …)
let planRows  = [];                    // every plan, small enough to hold
let planView  = new Date();            // the month the programme is showing
let planMode  = 'programme';           // programme (bar chart) or calendar
let plansTable = null;                 // null unknown · true ready · false not created yet

const PLAN_SQL_HINT = 'Planning needs its tables adding to Supabase. '
  + 'The setup SQL came with this update — run it in the SQL editor, then come back.';

const SUGGESTED_PROJECTS = ['Flats', 'Houses'];

/* Three states, and no more than three. Anything past its end date and not
   complete shows as Overdue on its own — that is worked out, not a fourth
   status somebody has to remember to set. */
const STATUSES = [
  { key: 'not_started', label: 'Not started' },
  { key: 'in_progress', label: 'In progress' },
  { key: 'completed',   label: 'Complete'    }
];
const statusLabel = k => k === 'delayed' ? 'Delayed'
  : (STATUSES.find(s => s.key === k) || STATUSES[0]).label;

function planMissing(err) {
  const m = String((err && (err.message || err.msg)) || err || '');
  const code = (err && err.code) || '';
  return code === '42P01' || code === 'PGRST205' ||
         /relation .*(plans|projects).* does not exist|could not find the table/i.test(m);
}

async function loadPlanning() {
  const [pj, pl] = await Promise.all([
    db.from('projects').select('*'),
    db.from('plans').select('*')
  ]);
  const err = pj.error || pl.error;
  if (err) {
    if (planMissing(err)) { plansTable = false; projects = []; planRows = []; return false; }
    toast(niceError(err), true);
    return false;
  }
  plansTable = true;
  projects = (pj.data || []).filter(p => !p.archived)
    .sort((a, b) => String(a.name).localeCompare(String(b.name)));
  planRows = (pl.data || []).slice().sort((a, b) =>
    String(a.start_date).localeCompare(String(b.start_date)) ||
    String(a.end_date).localeCompare(String(b.end_date)) ||
    String(a.title).localeCompare(String(b.title)));
  return true;
}

const projectById   = id => projects.find(p => p.id === id) || null;
const projectName   = id => { const p = projectById(id); return p ? p.name : 'No project'; };
const coversDay     = (p, ds) => String(p.start_date) <= ds && ds <= String(p.end_date);
const isOverdue     = p => String(p.end_date) < ymd(new Date()) && p.status !== 'completed';

/* "3 Sep → 20 Sep", or a single date when it starts and ends the same day */
function planWhen(p) {
  const short = ds => {
    const [y, m, d] = String(ds).split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  };
  return String(p.start_date) === String(p.end_date)
    ? short(p.start_date)
    : short(p.start_date) + ' → ' + short(p.end_date);
}

async function createProject(name) {
  try {
    const res = await db.from('projects')
      .insert({ name: name.trim(), kind: 'project', created_by: session.user.id }).select();
    if (res.error) throw res.error;
    const row = (res.data || [])[0];
    if (row) { projects.push(row); projects.sort((a, b) => a.name.localeCompare(b.name)); }
    return row;
  } catch (e) { toast(planMissing(e) ? PLAN_SQL_HINT : niceError(e), true); return null; }
}

/* one row: the job above the plan, dates under it, status on the right */
function planRow(p) {

  const right = el('div', { class: 'pright' }, [

    ]),
