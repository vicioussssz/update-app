const TL_ROW  = 46;      // one day
const TL_LANE = 132;     // one column of activities

/* Which days the programme covers: everything planned, with a little room
   before and after, and always at least the next few weeks. */
function programmeRange() {
  const today = new Date(); today.setHours(12, 0, 0, 0);
  let from = new Date(today); from.setDate(from.getDate() - 3);
  let to   = new Date(today); to.setDate(to.getDate() + 45);
  planRows.forEach(p => {
    const st = new Date(String(p.start_date) + 'T12:00:00');
    const en = new Date(String(p.end_date)   + 'T12:00:00');
    if (st < from) from = new Date(st.getFullYear(), st.getMonth(), st.getDate() - 3, 12);
    if (en > to)   to   = new Date(en.getFullYear(), en.getMonth(), en.getDate() + 3, 12);
  });
  const days = [];
  for (let d = new Date(from); d <= to && days.length < 500; d.setDate(d.getDate() + 1))
    days.push(ymd(d));
  return days;
}

/* Pack the activities of one job into as few columns as possible: a new column
   is only started when two jobs actually overlap. */
function packLanes(list) {
  const lanes = [];
  list.slice().sort((a, b) => String(a.start_date).localeCompare(String(b.start_date)))
    .forEach(p => {
      let lane = lanes.find(L => L.every(q => String(q.end_date) < String(p.start_date)
                                           || String(q.start_date) > String(p.end_date)));
      if (!lane) { lane = []; lanes.push(lane); }
      lane.push(p);
    });
  return lanes;
}

function buildProgramme() {
  const host = el('div', { id: 'programme' });

  if (!planRows.length) {
    host.appendChild(el('p', { class: 'gempty', text: projects.length
      ? 'Nothing planned yet. Add the first job below.'
      : 'Add your first plan below and you can create the job as you go.' }));
    return host;
  }

  const days  = programmeRange();
  const index = new Map(days.map((d, i) => [d, i]));
  const today = ymd(new Date());
  const H = days.length * TL_ROW;

  // one group of columns per job, in the order the jobs are listed
  const jobs = projects
    .map((pj, i) => ({ pj, i, lanes: packLanes(planRows.filter(p => p.project_id === pj.id)) }))
    .filter(g => g.lanes.length);
  const loose = planRows.filter(p => !projectById(p.project_id));
  if (loose.length) jobs.push({ pj: null, i: jobs.length, lanes: packLanes(loose) });

  // a colour per job, so which job a bar belongs to is obvious at a glance
  host.appendChild(el('div', { class: 'tlkey', id: 'tlkey' }, jobs.map(g =>
    el('span', {}, [
      el('i', { class: 'j' + (g.i % 4), style: 'background:' +
        ['#0f6d64', '#2f5ea8', '#6b4a9e', '#8a5a2b'][g.i % 4] }),
      el('em', { style: 'font-style:normal', text: g.pj ? g.pj.name : 'No job' })
    ]))));

  const laneCount = jobs.reduce((n, g) => n + g.lanes.length, 0);
  const width = Math.max(laneCount * TL_LANE, 1);

  // the job names, sitting over their own columns
  const jobHead = el('div', { class: 'tljobs', style: 'width:' + width + 'px' },
    jobs.map(g => el('div', { class: 'tljob',
      style: 'width:' + (g.lanes.length * TL_LANE) + 'px',
      text: g.pj ? g.pj.name : 'No job' })));

  // the dates, down the side
  const dateCol = el('div', { class: 'tldates', style: 'height:' + H + 'px' });
  days.forEach((ds, i) => {
    const [yy, mm, dd] = ds.split('-').map(Number);
    const dt = new Date(yy, mm - 1, dd);
    const dow = dt.getDay();
    const firstOfMonth = dd === 1 || i === 0;
    dateCol.appendChild(el('div', {
      class: 'tlday' + (dow === 0 || dow === 6 ? ' we' : '')
           + (firstOfMonth ? ' mstart' : '') + (ds === today ? ' today' : ''),
      style: `top:${i * TL_ROW}px;height:${TL_ROW}px`
    }, [
      firstOfMonth ? el('em', { text: MONTHS[mm - 1].slice(0, 3) }) : null,
      el('b', { text: String(dd) }),
      el('span', { text: ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dow] })
    ]));
  });

  // the activities, beside them
  const lanesBox = el('div', { class: 'tllanes',
    style: `width:${width}px;height:${H}px` });
  days.forEach((ds, i) => {
    const dow = new Date(ds + 'T12:00:00').getDay();
    if (dow === 0 || dow === 6)
      lanesBox.appendChild(el('div', { class: 'tlline we',
        style: `top:${i * TL_ROW}px;height:${TL_ROW}px` }));
    lanesBox.appendChild(el('div', {
      class: 'tlline' + (ds === today ? ' now' : ''),
      style: `top:${(i + 1) * TL_ROW - 1}px`
    }));
  });

  let laneX = 0;
  jobs.forEach(g => g.lanes.forEach(lane => {
    const x = laneX; laneX += TL_LANE;
    lane.forEach(p => {
      const si = index.has(String(p.start_date)) ? index.get(String(p.start_date)) : 0;
      const ei = index.has(String(p.end_date)) ? index.get(String(p.end_date)) : days.length - 1;
      const overdue = isOverdue(p) && p.status !== 'completed';
      lanesBox.appendChild(el('button', {
        class: 'tlbar j' + (g.i % 4)
             + (p.status === 'completed' ? ' done' : '') + (overdue ? ' late' : ''),
        style: `left:${x + 4}px;width:${TL_LANE - 8}px;`
             + `top:${si * TL_ROW + 3}px;height:${(ei - si + 1) * TL_ROW - 7}px`,
        onclick: () => openPlanForm(p, null)
      }, [
        el('b', { text: p.title }),
        el('span', { text: overdue ? 'Overdue' : statusLabel(p.status) })
      ]));
    });
  }));

  const pan = el('div', { class: 'tlpan', id: 'tlpan' }, [
    el('div', { style: 'width:' + width + 'px' }, [jobHead, lanesBox])
  ]);
  host.appendChild(el('div', { class: 'tlgrid' }, [
    el('div', { style: 'display:flex;flex-direction:column' }, [
      el('div', { class: 'tljob', text: '' }),      // lines the dates up with the job row
      dateCol
    ]),
    pan
  ]));
  return host;
}

/* Put a date in the middle of the screen — used by the Today button and by the
   month arrows. */
function scrollProgrammeTo(ds) {
  const days = programmeRange();
  const i = days.indexOf(ds);
  const host = $('#programme');
  if (i < 0 || !host) return false;
  const top = host.getBoundingClientRect().top + window.scrollY;
  window.scrollTo({ top: Math.max(0, top + i * TL_ROW - window.innerHeight / 3),
                    behavior: 'smooth' });
  return true;
}

function paintPlanning() {
  const y = planView.getFullYear(), m = planView.getMonth();
  $('#planlabel').textContent = `${MONTHS[m]} ${y}`;

  const today = ymd(new Date());
  const underway = planRows.filter(p =>
    p.status === 'in_progress' || (isOverdue(p) && p.status !== 'completed'));
  const upcoming = planRows.filter(p =>
    String(p.start_date) > today && p.status !== 'completed' && !underway.includes(p));

  $('#pjcount').textContent = String(projects.length);
  $('#punder').textContent  = String(underway.length);
  $('#pupnext').textContent = String(upcoming.length);

  /* ---------- programme or calendar ---------- */
  const seg = $('#planseg');
  seg.innerHTML = '';
  [['programme', 'Programme'], ['calendar', 'Calendar']].forEach(([k, label]) =>
    seg.appendChild(el('button', {
      class: planMode === k ? 'on' : '', text: label, 'data-mode': k,
      onclick: () => { planMode = k; paintPlanning(); }
    })));

  const showGantt = planMode === 'programme';
  $('#pdow').classList.toggle('hide', showGantt);
  $('#pgrid').classList.toggle('hide', showGantt);
  const oldG = $('#programme');
  if (oldG) oldG.remove();
  if (showGantt) $('#pgrid').insertAdjacentElement('beforebegin', buildProgramme());

  const grid = $('#pgrid');
  grid.innerHTML = '';
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;            // Monday-first
  const days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < lead; i++) grid.appendChild(el('div', { class: 'cell blank' }));
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const on = planRows.filter(p => coversDay(p, ds));
    const cell = el('button', {
      class: 'cell plan' + (on.length ? ' has' : '') + (ds === today ? ' today' : ''),
      onclick: () => openPlanDay(ds)
    }, [ el('span', { class: 'n', text: String(d) }) ]);
    // one bar per plan running through this day, so a run reads across the row
    const runs = el('div', { class: 'runs' });
    on.slice(0, 3).forEach(p => runs.appendChild(el('div', {
      class: 'run s-' + p.status
           + (String(p.start_date) === ds ? ' start' : String(p.end_date) === ds ? ' end' : ' mid')
    })));
    if (on.length > 3) runs.appendChild(el('div', { class: 'runmore', text: '+' + (on.length - 3) }));
    cell.appendChild(runs);
    grid.appendChild(cell);
  }

  /* ---------- the lists ---------- */
  const host = $('#planlists');
  host.innerHTML = '';

  const section = (heading, list, opts) => {
    if (!list.length) return;
    host.appendChild(el('div', { class: 'pgroup', id: opts.id }, [
      el('h4', {}, [el('span', { text: heading }), el('i', { text: String(list.length) })]),
      el('div', { class: 'card' }, list.map(p => planRow(p, opts)))
    ]));
  };

  section('Currently underway', underway, { id: 'underway' });
  section('Upcoming', upcoming, { id: 'upcoming' });

  if (!planRows.length) {
    host.appendChild(el('div', { class: 'pgroup' }, [
      el('p', { class: 'empty', text: projects.length
        ? 'Nothing planned yet. Add the first stage below.'
        : 'Nothing planned yet. Add your first plan below and you can create the project as you go.' })
    ]));
  } else if (!underway.length && !upcoming.length) {
    host.appendChild(el('div', { class: 'pgroup' }, [
      el('p', { class: 'empty', text: 'Nothing underway or coming up — everything planned has finished.' })
    ]));
  }
}

/* everything running on one day */
function openPlanDay(ds) {
  const list = planRows.filter(p => coversDay(p, ds));
  sheet({
    title: prettyDate(ds),
    sub: list.length ? `${list.length} on site` : '',
    body: [
      list.length
        ? el('div', { class: 'card' }, list.map(p => planRow(p)))
        : el('p', { class: 'empty', text: 'Nothing planned for this day.' })
    ],
    foot: [
      el('button', { class: 'btn btn-ghost', text: 'Close', onclick: closeSheet }),
      el('button', { class: 'btn btn-primary', id: 'daddplan', text: '+  Add Plan',
        onclick: () => { closeSheet(); openPlanForm(null, ds); } })
    ]
  });
}

/* Add or edit. What it is, which PROJECT, when it runs, where it has got to. */
function openPlanForm(plan, dateStr) {
  const editing = !!plan;
  const startWith = dateStr || ymd(new Date());

  let projectId = editing ? plan.project_id : (projects.length === 1 ? projects[0].id : null);
  let status    = editing ? plan.status : 'not_started';

  const title = el('input', { type: 'text', id: 'p_title', maxlength: '120',
    placeholder: 'e.g. Foundations', value: editing ? plan.title : '' });
  const start = el('input', { type: 'date', id: 'p_start',
    value: editing ? String(plan.start_date) : startWith });
  // an end date is only needed when something runs on past its start day
  const end   = el('input', { type: 'date', id: 'p_end',
    value: editing && String(plan.end_date) !== String(plan.start_date)
      ? String(plan.end_date) : '' });
  const notes = el('textarea', { id: 'p_notes', class: 'pnote', maxlength: '500',
    placeholder: 'Optional' });
  notes.value = editing && plan.notes ? plan.notes : '';

  // an end date can never be before the start; moving the start carries it along
  start.onchange = () => { if (end.value && end.value < start.value) end.value = start.value; };

  const projectBtn = el('button', { class: 'pickproject', id: 'p_project' });
  const paintProject = () => {
    projectBtn.innerHTML = '';
    const p = projectById(projectId);
    projectBtn.appendChild(el('span', { class: 'lbl', text: p ? p.name : 'Choose a job' }));
    projectBtn.appendChild(el('span', { class: 'chev' }));
  };
  projectBtn.onclick = () => pickProjectInline(id => { projectId = id; paintProject(); });
  paintProject();

  const statusBox = el('div', { class: 'statuses', id: 'p_status' });
  const paintStatus = () => {
    statusBox.innerHTML = '';
    STATUSES.forEach(st => statusBox.appendChild(el('button', {
      type: 'button', class: status === st.key ? 'on' : '', text: st.label,
      'data-status': st.key,
      onclick: () => { status = st.key; paintStatus(); }
    })));
  };
  paintStatus();

  const save = el('button', { class: 'btn btn-primary', id: 'p_save',
    text: editing ? 'Save changes' : 'Save' });

  save.onclick = async () => {
    const what = title.value.trim();
    if (!what)  { title.focus(); toast('What is the plan?', true); return; }
    if (!projectId) { toast('Choose a job for this plan', true); return; }
    if (!start.value) { start.focus(); toast('Pick a start date', true); return; }
    // no end date means it is a one-day job
    const endValue = end.value || start.value;
    if (endValue < start.value) { end.focus(); toast('The end date is before the start', true); return; }

    save.disabled = true;
    busy(true, editing ? 'Saving…' : 'Adding…');
    const payload = {
      title: what,
      project_id: projectId,
      start_date: start.value,
      end_date: endValue,
      status,
      notes: notes.value.trim() || null
    };
    try {
      const res = editing
        ? await db.from('plans').update(payload).eq('id', plan.id)
        : await db.from('plans').insert(Object.assign({}, payload,
            { created_by: session.user.id, created_by_name: session.user.email }));
      if (res.error) throw res.error;
      await loadPlanning();
      busy(false);
      closeSheet();
      paintPlanning();
      toast(editing ? 'Plan updated' : what + ' added to ' + projectName(projectId));
    } catch (e) {
      busy(false); save.disabled = false;
      toast(planMissing(e) ? PLAN_SQL_HINT : niceError(e), true);
    }
  };

  const remove = async () => {
    if (!await ask('Delete this plan?',
        `"${plan.title}" will be removed for everyone.`, 'Delete')) return;
    busy(true, 'Deleting…');
    try {
      const res = await db.from('plans').delete().eq('id', plan.id);
      if (res.error) throw res.error;
      await loadPlanning();
      busy(false); closeSheet(); paintPlanning(); toast('Deleted');
    } catch (e) { busy(false); toast(niceError(e), true); }
  };

  sheet({
    title: editing ? 'Plan' : 'Add Plan',
    sub: editing ? projectName(plan.project_id) : '',
    body: [
      el('div', {}, [el('label', { for: 'p_title', text: 'What is the plan' }), title]),
      el('div', {}, [el('label', { text: 'Job' }), projectBtn]),
      el('div', { class: 'row2' }, [
        el('div', {}, [el('label', { for: 'p_start', text: 'Start date' }), start]),
        el('div', {}, [el('label', { for: 'p_end',   text: 'End date (optional)' }), end])
      ]),
      el('div', {}, [el('label', { text: 'Status' }), statusBox]),
      el('div', {}, [el('label', { for: 'p_notes', text: 'Note (optional)' }), notes]),
      editing && isOverdue(plan) && plan.status !== 'completed'
        ? el('p', { class: 'hintline', id: 'p_overdue',
            text: 'This is past its end date and is not marked complete.' })
        : null,
      editing ? el('button', { class: 'btn btn-danger btn-full', id: 'p_del',
        text: 'Delete plan', onclick: remove }) : null
    ],
    foot: [
      el('button', { class: 'btn btn-ghost', text: 'Cancel', onclick: closeSheet }),
      save
    ]
  });
  setTimeout(() => title.focus(), 260);
}

/* ============================================================
   SITE RECORDS
   Evidence of work that is about to be covered up: what was done, where, on
   which job, on what day, and the photographs to prove it.

   Deliberately its own world. It has its own tables (site_records and
   site_photos) and its own folder inside storage, and it never reads or writes
   a receipt: nothing here can reach the receipt calendar, the receipt folders,
   Recently Added, the receipt totals or the receipt PDF. The only things it
   borrows are the parts that would be silly to build twice — the signed-URL and
   thumbnail loader, the picture viewer's zoom, the job picker and the sheets.
   ============================================================ */
let siteRecords = [];                  // records, newest first, photos attached
let siteJobFilter = null;              // a project id, or null for every job
let siteTable = null;                  // null unknown · true ready · false not created yet

const SITE_DIR = 'site';               // its own folder inside the private bucket
const SITE_SQL_HINT = 'Site Records needs its tables adding to Supabase. '
  + 'The setup SQL came with this update — run it in the SQL editor, then come back.';

function siteMissing(err) {
  const m = String((err && (err.message || err.msg)) || err || '');
  const code = (err && err.code) || '';
  return code === '42P01' || code === 'PGRST205' ||
         /relation .*site_(records|photos).* does not exist|could not find the table/i.test(m);
}

async function loadSiteRecords() {
  const [recs, pics] = await Promise.all([
    db.from('site_records').select('*'),
    db.from('site_photos').select('*')
  ]);
  const err = recs.error || pics.error;
  if (err) {
    if (siteMissing(err)) { siteTable = false; siteRecords = []; return false; }
    toast(niceError(err), true);
    return false;
  }
  siteTable = true;
  const byRecord = new Map();
  (pics.data || []).forEach(ph => {
    if (!byRecord.has(ph.record_id)) byRecord.set(ph.record_id, []);
    byRecord.get(ph.record_id).push(ph);
  });
  byRecord.forEach(list => list.sort((a, b) =>
    (a.sort - b.sort) || String(a.created_at).localeCompare(String(b.created_at))));

  // newest first: this is evidence, and the most recent is what gets looked for
  siteRecords = (recs.data || []).map(r =>
    Object.assign({}, r, { photos: byRecord.get(r.id) || [] }))
    .sort((a, b) => String(b.record_date).localeCompare(String(a.record_date)) ||
                    String(b.created_at).localeCompare(String(a.created_at)));
  return true;
}

function showSite(on) {
  $('#site').classList.toggle('hide', !on);
  if (on) $('#plan').classList.add('hide');      // one section at a time
  $('#app').classList.toggle('hide', on);
  window.scrollTo(0, 0);
}

async function openSiteRecords() {
  busy(true, 'Loading site records…');
  await loadFolders();                       // harmless, and keeps jobs in step
  await loadPlanning().catch(() => {});      // jobs live in the projects table
  const ok = await loadSiteRecords();
  busy(false);
  showSite(true);
  if (!ok && siteTable === false) {
    $('#sitelist').innerHTML = '';
    $('#sitelist').appendChild(el('p', { class: 'empty', text: SITE_SQL_HINT }));
    return;
  }
  if (!ok) { showSite(false); return; }
  paintSite();
}

function paintSite() {
  const shown = siteJobFilter
    ? siteRecords.filter(r => r.project_id === siteJobFilter)

  $('#srcount').textContent   = String(shown.length);
  $('#srphotos').textContent  = String(shown.reduce((n, r) => n + r.photos.length, 0));

    host.appendChild(el('p', { class: 'empty', text: siteRecords.length

        + 'it below with the date and where it is.' }));

  }

  host.appendChild(el('p', { class: 'srhead',
    text: 'Photographic evidence of work before it was covered up. Newest first.' }));

  // gets looked for
  const jobs = [...new Set(shown.map(r => r.project_id))]
    .sort((a, b) => projectName(a).localeCompare(projectName(b)));

/* Full screen, one photo at a time: pinch to zoom with the viewer's own engine,
   swipe or tap the arrows to move between them. */
async function openSitePhotos(rec, startAt) {
  let i = Math.max(0, Math.min(startAt || 0, rec.photos.length - 1));

  const overlay = el('div', { class: 'viewer', id: 'sviewer' });
  const body = el('div', { class: 'vbody', id: 'vbody' });
  const counter = el('b', { text: '' });

  const paint = async () => {
    const ph = rec.photos[i];
    body.innerHTML = '';
    counter.textContent = (i + 1) + ' of ' + rec.photos.length;
    let url = thumbs.get(ph.file_path);
    if (!url) {
      const { data } = await db.storage.from(BUCKET).createSignedUrl(ph.file_path, 3600);
      url = data && data.signedUrl;
      if (url) thumbs.set(ph.file_path, url);
    }
    if (!url) { body.appendChild(el('p', { class: 'empty', text: 'Could not load this photo.' })); return; }
    const img = el('img', { id: 'vimg', src: url, alt: rec.title, decoding: 'async' });
    body.appendChild(img);
    overlay.classList.remove('zoomed');
    bindZoomGestures(overlay, img, body);
  };

  const step = d => {
    const next = i + d;
    if (next < 0 || next >= rec.photos.length) return;
    i = next; paint();
  };

  overlay.appendChild(el('div', { class: 'vhead' }, [
    el('button', { class: 'icb', 'aria-label': 'Back', onclick: () => overlay.remove(),
      html: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' }),
    el('b', { text: rec.title }),
    el('button', { class: 'icb vreset', 'aria-label': 'Reset zoom',
      html: '<svg viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 012-2h3M16 3h3a2 2 0 012 2v3M21 16v3a2 2 0 01-2 2h-3M8 21H5a2 2 0 01-2-2v-3"/></svg>' })
  ]));
  overlay.appendChild(body);

  if (rec.photos.length > 1) {
    overlay.appendChild(el('div', { class: 'svnav' }, [
      el('button', { class: 'icb', id: 'svprev', 'aria-label': 'Previous photo',
        onclick: () => step(-1),
        html: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>' }),
      counter,
      el('button', { class: 'icb', id: 'svnext', 'aria-label': 'Next photo',
        onclick: () => step(1),
        html: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>' })
    ]));

    // a sideways flick moves to the next photo, but only when it is not zoomed
    // in — while zoomed, dragging pans the picture instead
    let x0 = null, y0 = null;
    body.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    body.addEventListener('touchend', e => {
      if (x0 === null || overlay.classList.contains('zoomed')) { x0 = null; return; }
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) step(dx < 0 ? 1 : -1);
      x0 = null;
    }, { passive: true });
  }

  document.body.appendChild(overlay);
  await paint();
}

async function deleteSiteRecord(rec) {
  const ok = await ask('Delete this record?',
    `"${rec.title}" and its ${rec.photos.length} photo${rec.photos.length === 1 ? '' : 's'} `
    + 'will be removed for everyone. This cannot be undone.', 'Delete');
  if (!ok) return;
  busy(true, 'Deleting…');
  try {
    const paths = rec.photos.map(p => p.file_path);
    const res = await db.from('site_records').delete().eq('id', rec.id);
    if (res.error) throw res.error;                 // photo rows go with it
    if (paths.length) await db.storage.from(BUCKET).remove(paths);
    paths.forEach(p => thumbs.delete(p));
    await loadSiteRecords();
    busy(false); closeSheet(); paintSite(); toast('Record deleted');
  } catch (e) { busy(false); toast(niceError(e), true); }
}

/* ---------- adding and editing ---------- */
function openSiteForm(rec) {
  const editing = !!rec;
  let projectId = editing ? rec.project_id : (projects.length === 1 ? projects[0].id : null);
  const kept = editing ? rec.photos.slice() : [];   // photos already stored
  const added = [];                                 // File objects waiting to go up

  const title = el('input', { type: 'text', id: 'sr_title', maxlength: '120',
    placeholder: 'e.g. Underground drainage', value: editing ? rec.title : '' });
  const date = el('input', { type: 'date', id: 'sr_date',
    value: editing ? String(rec.record_date) : ymd(new Date()) });
  const location = el('input', { type: 'text', id: 'sr_loc', maxlength: '120',
    placeholder: 'e.g. Rear elevation, Plot 3', value: editing && rec.location ? rec.location : '' });
  const notes = el('textarea', { id: 'sr_notes', class: 'pnote', maxlength: '1000',
    placeholder: 'What was done, and anything worth remembering about it' });
  notes.value = editing && rec.notes ? rec.notes : '';

  const jobBtn = el('button', { class: 'pickproject', id: 'sr_job' });
  const paintJob = () => {
    jobBtn.innerHTML = '';
    const p = projectById(projectId);
    jobBtn.appendChild(el('span', { class: 'lbl', text: p ? p.name : 'Choose a job' }));
    jobBtn.appendChild(el('span', { class: 'chev' }));
  };
  jobBtn.onclick = () => pickProjectInline(id => { projectId = id; paintJob(); });
  paintJob();

  const grid = el('div', { class: 'srgrid', id: 'sr_photos' });
  const paintPhotos = () => {
    grid.innerHTML = '';
    kept.forEach(ph => grid.appendChild(el('div', { class: 'srcell' }, [
      el('img', { alt: '', 'data-path': ph.file_path, loading: 'lazy', decoding: 'async',
                  src: thumbs.get(ph.file_path) || '' }),
      el('button', { class: 'drop', 'aria-label': 'Remove', text: '×',
        onclick: () => { kept.splice(kept.indexOf(ph), 1); paintPhotos(); } })
    ])));
    added.forEach(a => grid.appendChild(el('div', { class: 'srcell' }, [
      el('img', { alt: '', src: a.url }),
      el('button', { class: 'drop', 'aria-label': 'Remove', text: '×',
        onclick: () => { URL.revokeObjectURL(a.url); added.splice(added.indexOf(a), 1); paintPhotos(); } })
    ])));
    if (!kept.length && !added.length)
      grid.appendChild(el('p', { class: 'hintline',
        text: 'No photos yet — add the ones showing the work before it is covered.' }));
    signThumbs();
  };
  paintPhotos();

  const picker = $('#sitefiles');
  picker.onchange = e => {
    [...(e.target.files || [])].forEach(f => {
      if (!/^image\//.test(f.type)) return;
      added.push({ file: f, url: URL.createObjectURL(f) });
    });
    picker.value = '';
    paintPhotos();
  };
  const addBtn = el('button', { class: 'btn btn-ghost btn-full', id: 'sr_addphotos',
    text: '+  Add photos', onclick: () => { picker.value = ''; picker.click(); } });

  const save = el('button', { class: 'btn btn-primary', id: 'sr_save',
    text: editing ? 'Save changes' : 'Save record' });

  save.onclick = async () => {
    const what = title.value.trim();
    if (!what) { title.focus(); toast('What was done?', true); return; }
    if (!projectId) { toast('Choose a job for this record', true); return; }
    if (!date.value) { date.focus(); toast('Pick the date it was done', true); return; }
    if (!kept.length && !added.length) { toast('Add at least one photo as evidence', true); return; }

    save.disabled = true;
    busy(true, editing ? 'Saving…' : 'Saving record…');
    const uploaded = [];
    try {
      const payload = {
        title: what, project_id: projectId, record_date: date.value,
        location: location.value.trim() || null,
        notes: notes.value.trim() || null
      };

      let recordId = editing ? rec.id : null;
      if (editing) {
        const up = await db.from('site_records').update(payload).eq('id', rec.id);
        if (up.error) throw up.error;
      } else {
        const ins = await db.from('site_records').insert(Object.assign({}, payload,
          { created_by: session.user.id, created_by_name: session.user.email })).select();
        if (ins.error) throw ins.error;
        recordId = ((ins.data || [])[0] || {}).id;
        if (!recordId) throw new Error('The record could not be created');
      }

      // photos live in their own folder in storage, never among the receipts
      for (let n = 0; n < added.length; n++) {
        busy(true, `Uploading photo ${n + 1} of ${added.length}…`, (n + 1) / added.length);
        const f = added[n].file;
        const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().slice(0, 5);
        const [y, m] = date.value.split('-');
        const path = `${SITE_DIR}/${y}/${m}/${crypto.randomUUID()}.${ext}`;
        const put = await db.storage.from(BUCKET)
          .upload(path, f, { contentType: f.type || 'image/jpeg', upsert: false });
        if (put.error) throw put.error;
        uploaded.push(path);
        const row = await db.from('site_photos').insert({
          record_id: recordId, file_path: path, file_type: f.type || 'image/jpeg',
          file_size: f.size, sort: kept.length + n, created_by: session.user.id
        });
        if (row.error) throw row.error;
      }

      // anything taken off the record while editing goes for good
      const dropped = editing ? rec.photos.filter(p => !kept.includes(p)) : [];
      if (dropped.length) {
        const del = await db.from('site_photos').delete().in('id', dropped.map(p => p.id));
        if (del.error) throw del.error;
        await db.storage.from(BUCKET).remove(dropped.map(p => p.file_path));
        dropped.forEach(p => thumbs.delete(p.file_path));
      }

      added.forEach(a => URL.revokeObjectURL(a.url));
      await loadSiteRecords();
      busy(false); save.disabled = false;
      closeSheet();
      paintSite();
      toast(editing ? 'Record updated' : 'Record saved');
    } catch (e) {
      // a half-finished save must not leave photos stranded in storage
      if (uploaded.length) await db.storage.from(BUCKET).remove(uploaded).catch(() => {});
      busy(false); save.disabled = false;
      toast(siteMissing(e) ? SITE_SQL_HINT : niceError(e), true);
    }
  };

  sheet({
    title: editing ? 'Edit record' : 'New site record',
    sub: editing ? prettyDate(String(rec.record_date)) : '',
    body: [
      el('div', {}, [el('label', { for: 'sr_title', text: 'What was done' }), title]),
      el('div', {}, [el('label', { text: 'Job' }), jobBtn]),
      el('div', { class: 'row2' }, [
        el('div', {}, [el('label', { for: 'sr_date', text: 'Date' }), date]),
        el('div', {}, [el('label', { for: 'sr_loc', text: 'Location' }), location])
      ]),
      el('div', {}, [el('label', { for: 'sr_notes', text: 'Description' }), notes]),
      el('div', {}, [el('label', { text: 'Photos' }), grid]),
      addBtn
    ],
    foot: [
      el('button', { class: 'btn btn-ghost', text: 'Cancel', onclick: () => {
        added.forEach(a => URL.revokeObjectURL(a.url));
        closeSheet();
      } }),
      save
    ]
  });
  setTimeout(() => title.focus(), 260);
}

function closeSheet() { $('#sheets').innerHTML = ''; }

function sheet({ title, sub, body, foot, onClose }) {
  const bail = () => { if (onClose) onClose(); closeSheet(); };
  const scrim = el('div', { class: 'scrim', onclick: e => { if (e.target === scrim) bail(); } });
  const head = el('div', { class: 'shead' }, [
    el('h3', { text: title }),
    sub ? el('span', { class: 'sub', text: sub }) : null,
    el('button', { class: 'icb', 'aria-label': 'Close', onclick: bail,
      html: '<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>' })
  ]);
  const card = el('div', { class: 'sheet' }, [
    el('div', { class: 'grab' }), head,
    el('div', { class: 'sbody' }, body),
    foot ? el('div', { class: 'sfoot' }, foot) : null
  ]);

  $('#sheets').innerHTML = '';
  $('#sheets').appendChild(scrim);

/* in-app confirm — native confirm() freezes a standalone PWA on iOS */
function ask(title, message, confirmLabel) {
  return new Promise(resolve => {
    const host = el('div', { id: 'askhost' });
    // A question waits on the person, so the working overlay has to stand down
    // while it is up — otherwise the dialog is behind an opaque screen, nothing
    // can be tapped, and the promise never settles.
    const wasBusy = !$('#busy').classList.contains('hide');
    if (wasBusy) busy(false);
    const done = v => {
      host.remove();
      if (wasBusy) busy(true);
      resolve(v);
    };
    const scrim = el('div', { class: 'scrim', onclick: e => { if (e.target === scrim) done(false); } });
    scrim.appendChild(el('div', { class: 'sheet' }, [
      el('div', { class: 'grab' }),
      el('div', { class: 'shead' }, [el('h3', { text: title })]),
      el('div', { class: 'sbody' }, [el('p', { class: 'ask', text: message })]),
      el('div', { class: 'sfoot' }, [
        el('button', { class: 'btn btn-ghost', text: 'Cancel', onclick: () => done(false) }),
        el('button', { class: 'btn btn-danger', text: confirmLabel || 'Confirm',
                       onclick: () => done(true) })
      ])
    ]));
    host.appendChild(scrim);
    document.body.appendChild(host);
  });
}

function receiptRow(r, showDate) {
  const isPdf = r.file_type === 'application/pdf';
